<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ЭлектроМонтаж — конструктор схем</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23f6c445'/><path d='M13 3 5.5 13.5h5L9.5 21 18 10.5h-5L13 3z' fill='%2317181d'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1013;--shell:#17181d;--side:#1b1d22;--card:#1d1f25;--card2:#22242b;--field:#14161a;
--line:#2a2d35;--line2:#383c46;--ink:#f4f5f7;--mut:#a0a6b1;--dim:#6d7380;
--yel:#f6c445;--yelT:#ffd975;--ydim:rgba(246,196,69,.13);
--green:#4ade80;--red:#ff6b5e;--blue:#5aa7ff;--cyan:#22d3ee;--purple:#a78bfa;--orange:#fb923c;--del:#b04352;
--disp:'Unbounded',sans-serif;--body:'Golos Text',sans-serif;--mono:'JetBrains Mono',monospace;
--sh:0 14px 34px rgba(0,0,0,.35);--canvas-bg:#111318;--canvas-grid:#23262e;}
html[data-theme="light"]{--bg:#eef1f5;--shell:#ffffff;--side:#fbfcfe;--card:#ffffff;--card2:#eef1f5;--field:#f7f8fa;
--line:#e3e7ee;--line2:#c9d1dc;--ink:#1a2438;--mut:#5b6472;--dim:#8a93a3;--yelT:#8a6a00;--ydim:rgba(246,196,69,.2);
--green:#1d8a54;--red:#d43d2a;--blue:#2559d3;--cyan:#0891b2;--purple:#7c3aed;--orange:#ea580c;--del:#a03340;
--sh:0 14px 34px rgba(30,40,60,.12);--canvas-bg:#f5f7fa;--canvas-grid:#dfe4ec;}
*{margin:0;padding:0;box-sizing:border-box}
html{overflow-x:hidden}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;min-height:100vh;padding:18px;overflow-x:hidden}
::selection{background:rgba(246,196,69,.3)}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;color:var(--ink)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border:3px solid var(--shell);border-radius:8px}
.app{max-width:1760px;margin:0 auto;display:grid;grid-template-columns:270px 1fr 300px;background:var(--shell);
border:1px solid var(--line);border-radius:24px;overflow:hidden;min-height:calc(100vh - 36px)}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px 16px;overflow:hidden}
.brand{display:flex;align-items:center;gap:12px;padding:2px 6px 18px;min-width:0}
.brand-ic{width:40px;height:40px;border-radius:12px;background:var(--yel);display:grid;place-items:center;box-shadow:0 6px 18px rgba(246,196,69,.28);flex:none}
.brand-ic svg{width:20px;height:20px;fill:#17181d}
.brand b{font-size:14.5px;font-weight:700;white-space:nowrap}
.brand .sub{font-size:11px;color:var(--dim)}
.lib-tabs{display:flex;gap:4px;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.lib-tabs button{flex:1;border:none;background:transparent;color:var(--mut);font-weight:600;font-size:11.5px;padding:7px 6px;border-radius:9px;white-space:nowrap}
.lib-tabs button.active{background:var(--yel);color:#17181d}
.lib-scroll{flex:1;overflow-y:auto;padding-right:4px;min-height:0}
.lib-hint{font-size:11.5px;color:var(--mut);background:var(--field);border:1px dashed var(--line2);border-radius:10px;padding:9px 11px;margin-bottom:10px;line-height:1.45}
.lib-hint b{color:var(--yelT)}
.lib-group-t{font-family:var(--disp);font-weight:600;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--yelT);margin:14px 4px 8px}
.lib-group-t:first-child{margin-top:2px}
.lib-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.lib-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 6px;background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.lib-item:hover{border-color:var(--yel)}
.lib-item svg{width:30px;height:30px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lib-item span{font-size:10.5px;color:var(--mut);text-align:center;line-height:1.2}
.main{display:flex;flex-direction:column;min-width:0;max-width:100%;background:var(--bg)}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--shell)}
.topbar .title{margin-right:auto;display:flex;align-items:center;gap:8px;min-width:0}
.topbar .title input{background:transparent;border:1px solid transparent;border-radius:8px;font-family:var(--disp);font-size:14px;font-weight:600;color:var(--ink);padding:4px 8px;width:200px;outline:none}
.topbar .title input:focus{border-color:var(--yel);background:var(--field)}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tool-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;transition:.15s;color:var(--mut)}
.tool-btn:hover{border-color:var(--line2);color:var(--ink)}
.tool-btn.active{background:var(--ydim);border-color:var(--yel);color:var(--yelT)}
.tool-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tool-sep{width:1px;height:26px;background:var(--line);margin:0 4px}
.canvas-wrap{flex:1;position:relative;overflow:hidden;min-height:0;background:var(--canvas-bg);touch-action:none}
#canvas{position:absolute;top:0;left:0;touch-action:none}
.zoom-ctrl{position:absolute;right:18px;bottom:18px;display:flex;flex-direction:column;gap:6px;z-index:10}
.zoom-ctrl button{width:40px;height:40px;border-radius:11px;border:1px solid var(--line2);background:var(--shell);color:var(--ink);font-size:18px;font-weight:600;display:grid;place-items:center;box-shadow:var(--sh)}
.zoom-pct{font-family:var(--mono);font-size:11px;text-align:center;color:var(--mut);background:var(--shell);border:1px solid var(--line2);border-radius:8px;padding:4px 0}
.canvas-info{position:absolute;left:18px;top:14px;display:flex;gap:8px;z-index:9;flex-wrap:wrap;max-width:70%}
.info-chip{font-size:11.5px;color:var(--mut);background:var(--shell);border:1px solid var(--line);border-radius:20px;padding:6px 12px;display:flex;align-items:center;gap:6px;box-shadow:var(--sh)}
.info-chip b{font-family:var(--mono);color:var(--ink)}
.info-chip .dot{width:7px;height:7px;border-radius:50%}
/* плавающие панели редактирования */
.float-bar{position:absolute;left:50%;transform:translateX(-50%);bottom:16px;z-index:15;display:none;
align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;background:var(--shell);border:1px solid var(--line2);
border-radius:14px;padding:8px 12px;box-shadow:var(--sh);max-width:96%;}
.float-bar.on{display:flex}
.wb-sel{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:13px;outline:none;color:var(--ink);max-width:180px}
.wb-sel:focus{border-color:var(--yel)}
.wb-len{font-family:var(--mono);font-size:12px;color:var(--yelT);font-weight:600;white-space:nowrap}
.eb-title{font-weight:700;font-size:13px;color:var(--yelT);white-space:nowrap}
.eb-size-wrap{display:flex;align-items:center;gap:6px}
.eb-size-wrap input{width:110px;accent-color:var(--yel)}
#ebSizeVal{font-family:var(--mono);font-size:11px;color:var(--mut);min-width:42px}
.right{background:var(--side);border-left:1px solid var(--line);padding:16px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.rp-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.rp-card h3{font-size:13px;font-weight:700;margin-bottom:11px;display:flex;align-items:center;gap:8px}
.rp-card h3 .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim);font-weight:400}
.prop-row{margin-bottom:10px}
.prop-row label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.prop-row .inp{width:100%;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:8px 11px;font-size:13px;outline:none}
.prop-row .inp:focus{border-color:var(--yel)}
select.inp{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%238a93a3' stroke-width='1.5' fill='none'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:30px}
.empty-prop{text-align:center;color:var(--dim);font-size:12.5px;padding:16px 8px}
.empty-prop .ic{font-size:22px;margin-bottom:6px}
.mono-val{font-family:var(--mono);font-size:13px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:9px;padding:8px 11px}
input[type=range]{accent-color:var(--yel)}
.spec-list{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto}
.spec-item{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:7px 9px;background:var(--field);border:1px solid var(--line);border-radius:9px}
.spec-item .si-ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none;background:var(--card2)}
.spec-item .si-ic svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.spec-item .si-nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spec-item .si-ct{font-family:var(--mono);font-weight:600;color:var(--yelT);flex:none;white-space:nowrap}
.spec-item .si-del{flex:none;width:32px;height:32px;border-radius:8px;border:none;background:rgba(255,107,94,.16);color:var(--red);font-size:16px;font-weight:700;display:grid;place-items:center}
.spec-item .si-del:active{background:var(--red);color:#fff}
.cost-total{margin-top:8px;font-family:var(--mono);font-weight:700;color:var(--yelT);font-size:14px;text-align:right}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:11px;font-weight:600;font-size:12.5px;padding:9px 14px;background:var(--card2);color:var(--ink);width:100%}
.btn-amber{background:var(--yel);color:#17181d}
.btn-ghost{background:var(--card2);border:1px solid var(--line)}
.btn-cyan{background:rgba(90,167,255,.12);color:var(--blue)}
.btn-red{background:rgba(255,107,94,.12);color:var(--red)}
.btn-green{background:rgba(74,222,128,.14);color:var(--green)}
.btn-sm{padding:8px 12px;font-size:12.5px}
.btn-row{display:flex;gap:7px}
.btn-row .btn{flex:1}
#overlay{position:fixed;inset:0;z-index:60;background:rgba(10,11,14,.7);backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:50px 18px;overflow-y:auto}
#overlay.on{display:flex}
#modal{width:100%;max-width:600px;background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:24px 26px;box-shadow:var(--sh)}
#modal h3{font-size:17px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px}
#modal h3::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--yel);flex:none}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.modal-foot .btn{width:auto}
.proj-list-m{display:flex;flex-direction:column;gap:7px;max-height:260px;overflow-y:auto;margin-bottom:12px}
.proj-m-item{display:flex;align-items:center;gap:9px;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
.proj-m-item .pm-nm{flex:1;font-weight:600;font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-m-item .pm-sub{font-size:11px;color:var(--dim)}
#toasts{position:fixed;right:22px;bottom:22px;z-index:80;display:flex;flex-direction:column;gap:9px}
.toast{background:var(--card);border:1px solid var(--line2);border-left:4px solid var(--yel);border-radius:12px;padding:12px 16px;font-size:13.5px;font-weight:600;box-shadow:var(--sh);max-width:380px}
.toast.ok{border-left-color:var(--green)} .toast.err{border-left-color:var(--red)}
.mb-tools{display:none}
@media(max-width:1100px){
body{padding:10px 10px 76px}
.app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;border-radius:18px}
.side{border-right:none;border-bottom:1px solid var(--line);padding:12px}
.lib-scroll{max-height:130px}
.lib-grid{grid-template-columns:repeat(4,1fr)}
.right{border-left:none;border-top:1px solid var(--line)}
.canvas-wrap{min-height:52vh}
.tools{display:none}
.mb-tools{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--shell);border-top:1px solid var(--line);
padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:6px;justify-content:center;overflow-x:auto}
.mb-tools .tool-btn{width:46px;height:46px;flex:none}
.float-bar{position:fixed;left:8px;right:8px;transform:none;bottom:calc(68px + env(safe-area-inset-bottom));max-width:none;z-index:41;padding:10px}
.wb-sel{flex:1;min-width:0;max-width:none;padding:12px 8px;font-size:13px}
.float-bar .btn{width:auto;flex:none;padding:12px 14px}
.eb-size-wrap input{width:90px}
#toasts{right:10px;bottom:150px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-ic"><svg viewBox="0 0 24 24"><path d="M13 3 5.5 13.5h5L9.5 21 18 10.5h-5L13 3z"/></svg></div>
      <div><b>Конструктор схем</b><div class="sub">кабельные трассы · видеонаблюдение</div></div>
    </div>
    <div class="lib-tabs">
      <button class="active" data-libtab="electro">⚡ Электрика</button>
      <button data-libtab="video">📹 Видео</button>
      <button data-libtab="cable">🔌 Трассы</button>
    </div>
    <div class="lib-scroll" id="libScroll"></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="title"><input id="projName" value="Новая схема" spellcheck="false"></div>
      <div class="tools">
        <button class="tool-btn active" data-tool="select"><svg viewBox="0 0 24 24"><path d="M4 4l7 17 2.5-7.5L21 11z"/></svg></button>
        <button class="tool-btn" data-tool="wire"><svg viewBox="0 0 24 24"><path d="M4 17c4 0 4-10 8-10s4 10 8 10"/><circle cx="4" cy="17" r="1.6"/><circle cx="20" cy="17" r="1.6"/></svg></button>
        <button class="tool-btn" data-tool="room"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1.5"/><path d="M4 12h16"/></svg></button>
        <button class="tool-btn" data-tool="text"><svg viewBox="0 0 24 24"><path d="M5 7V5h14v2M12 5v14M9 19h6"/></svg></button>
        <button class="tool-btn" data-tool="ruler"><svg viewBox="0 0 24 24"><rect x="2" y="14" width="20" height="6" rx="1.5" transform="rotate(-30 12 17)"/><path d="M8 13.5l1.2 2M11.5 11.5l1.2 2M15 9.5l1.2 2"/></svg></button>
        <div class="tool-sep"></div>
        <button class="tool-btn" id="btnBg"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M3 17l5-4 4 3 4-4 5 5"/></svg></button>
        <button class="tool-btn" id="btnUndo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
        <button class="tool-btn" id="btnRedo"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
        <button class="tool-btn" id="btnClear"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg></button>
      </div>
      <input type="file" id="bgFile" accept="image/*" hidden>
    </div>

    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="canvas"></canvas>
      <div class="canvas-info" id="canvasInfo"></div>
      <div class="zoom-ctrl">
        <button id="zoomIn">+</button><div class="zoom-pct" id="zoomPct">100%</div>
        <button id="zoomOut">−</button><button id="zoomFit" style="font-size:13px">⤢</button>
      </div>

      <!-- панель кабеля / трассы -->
      <div class="float-bar" id="wireBar">
        <select id="wbCable" class="wb-sel"></select>
        <select id="wbColor" class="wb-sel"></select>
        <select id="wbThick" class="wb-sel">
          <option value="1.5">Тонкая</option><option value="2.5">Средняя</option>
          <option value="3.5" selected>Толстая</option><option value="5">Очень толстая</option>
        </select>
        <span class="wb-len" id="wbLen"></span>
        <button class="btn btn-amber btn-sm" id="wbDone">✓ Готово</button>
        <button class="btn btn-red btn-sm" id="wbDelete" style="display:none">🗑</button>
        <button class="btn btn-ghost btn-sm" id="wbCancel">✕</button>
      </div>

      <!-- панель элемента / зоны / текста -->
      <div class="float-bar" id="editBar">
        <span class="eb-title" id="ebTitle"></span>
        <button class="btn btn-ghost btn-sm" id="ebLabel">✏️</button>
        <button class="btn btn-ghost btn-sm" id="ebRot">⟳ 90°</button>
        <span class="eb-size-wrap" id="ebSizeWrap"><span id="ebSizeVal">100%</span><input type="range" id="ebSize" min="40" max="300" value="100"></span>
        <button class="btn btn-red btn-sm" id="ebDel">🗑</button>
        <button class="btn btn-ghost btn-sm" id="ebClose">✕</button>
      </div>
    </div>
  </div>

  <aside class="right">
    <div class="rp-card" id="bgCard" style="display:none">
      <h3>🖼 План помещения</h3>
      <div class="prop-row"><label>Масштаб плана: <span id="bgScaleVal">100%</span></label><input type="range" id="bgScale" min="10" max="400" value="100"></div>
      <div class="prop-row"><label>Прозрачность: <span id="bgOpVal">85%</span></label><input type="range" id="bgOp" min="10" max="100" value="85"></div>
      <div class="btn-row"><button class="btn btn-ghost btn-sm" id="bgFit">⤢ Вписать</button><button class="btn btn-red btn-sm" id="bgDel">Удалить</button></div>
    </div>
    <div class="rp-card"><h3>Спецификация <span class="cnt" id="specCount"></span></h3><div class="spec-list" id="specList"></div></div>
    <div class="rp-card"><h3>💰 Стоимость</h3><div class="spec-list" id="costList"></div><div class="cost-total" id="costTotal"></div></div>
    <div class="rp-card"><h3>Проект</h3>
      <div class="prop-row"><label>Привязка к смете</label><div class="mono-val" id="linkedProj" style="font-size:12px">не привязано</div></div>
      <button class="btn btn-ghost btn-sm" id="btnProjModal" style="margin-bottom:8px">📁 Выбрать / создать проект</button>
      <button class="btn btn-green btn-sm" id="btnSendSmeta" style="margin-bottom:8px">📤 Отправить кабели в смету</button>
      <div class="btn-row" style="margin-bottom:8px"><button class="btn btn-ghost btn-sm" id="btnSave">💾 Сохранить</button><button class="btn btn-ghost btn-sm" id="btnLoad">📂 Открыть</button></div>
      <select class="inp" id="projList" style="width:100%;margin-bottom:8px"></select>
      <div class="btn-row"><button class="btn btn-cyan btn-sm" id="btnExportPng">🖼 PNG</button><button class="btn btn-amber btn-sm" id="btnExportPdf">📄 PDF</button></div>
    </div>
  </aside>
</div>

<div class="mb-tools">
  <button class="tool-btn active" data-tool="select"><svg viewBox="0 0 24 24"><path d="M4 4l7 17 2.5-7.5L21 11z"/></svg></button>
  <button class="tool-btn" data-tool="wire"><svg viewBox="0 0 24 24"><path d="M4 17c4 0 4-10 8-10s4 10 8 10"/><circle cx="4" cy="17" r="1.6"/><circle cx="20" cy="17" r="1.6"/></svg></button>
  <button class="tool-btn" data-tool="room"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1.5"/><path d="M4 12h16"/></svg></button>
  <button class="tool-btn" data-tool="text"><svg viewBox="0 0 24 24"><path d="M5 7V5h14v2M12 5v14M9 19h6"/></svg></button>
  <button class="tool-btn" data-tool="ruler"><svg viewBox="0 0 24 24"><rect x="2" y="14" width="20" height="6" rx="1.5" transform="rotate(-30 12 17)"/><path d="M8 13.5l1.2 2M11.5 11.5l1.2 2M15 9.5l1.2 2"/></svg></button>
  <button class="tool-btn" id="btnBgMb"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M3 17l5-4 4 3 4-4 5 5"/></svg></button>
  <button class="tool-btn" id="btnUndoMb"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
  <button class="tool-btn" id="btnDelMb"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></svg></button>
</div>

<div id="overlay"><div id="modal"></div></div>
<div id="toasts"></div>

<script>
/* типы кабелей и трасс (лоток/гофра/короб теперь тоже трассы) */
var CABLE_TYPES={
  vvg15:{name:"ВВГнг-LS 3×1,5",unit:"м.п.",color:"var(--yel)",trade:"elektro"},
  vvg25:{name:"ВВГнг-LS 3×2,5",unit:"м.п.",color:"var(--yel)",trade:"elektro"},
  vvg40:{name:"ВВГнг-LS 3×4",unit:"м.п.",color:"var(--orange)",trade:"elektro"},
  utp:{name:"UTP cat5e витая пара",unit:"м.п.",color:"var(--cyan)",trade:"video"},
  coax:{name:"Коаксиальный КВК RG-6",unit:"м.п.",color:"var(--orange)",trade:"video"},
  ground:{name:"Провод заземления ПВ-3",unit:"м.п.",color:"var(--green)",trade:"elektro"},
  tray:{name:"Лоток кабельный",unit:"м.п.",color:"var(--mut)",trade:"elektro",route:true},
  conduit:{name:"Гофра труба",unit:"м.п.",color:"var(--mut)",trade:"elektro",route:true,dash:true},
  box:{name:"Короб кабельный",unit:"м.п.",color:"var(--dim)",trade:"elektro",route:true}};
var WIRE_COLORS={"var(--yel)":"⚡ жёлтый","var(--cyan)":"📹 голубой","var(--orange)":"🟠 оранжевый","var(--green)":"🟢 зелёный","var(--red)":"🔴 красный","var(--purple)":"🟣 фиолетовый","var(--mut)":"⚪ серый"};
var LIBRARY={
  electro:{groups:{
    "Щитовое оборудование":[{type:"panel",name:"Щит / ВРУ",color:"var(--yel)",w:64,h:70,m:0.6,draw:"drawPanel"}],
    "Розетки и выключатели":[
      {type:"socket",name:"Розетка",color:"var(--blue)",w:34,h:34,m:0.09,draw:"drawSocket"},
      {type:"socket2",name:"Розетка двойная",color:"var(--blue)",w:44,h:34,m:0.12,draw:"drawSocket2"},
      {type:"switch",name:"Выключатель",color:"var(--blue)",w:30,h:30,m:0.09,draw:"drawSwitch"},
      {type:"switch2",name:"Проходной",color:"var(--blue)",w:30,h:30,m:0.09,draw:"drawSwitch2"}],
    "Освещение":[
      {type:"lamp",name:"Светильник",color:"var(--yel)",w:36,h:36,m:0.4,draw:"drawLamp"},
      {type:"spot",name:"Точечный свет",color:"var(--yel)",w:24,h:24,m:0.1,draw:"drawSpot"},
      {type:"led",name:"LED-лента",color:"var(--yel)",w:70,h:14,m:0.5,draw:"drawLed"}],
    "Узлы":[
      {type:"jbox",name:"Расп. коробка",color:"var(--orange)",w:30,h:30,m:0.1,draw:"drawJbox"},
      {type:"meter",name:"Счётчик",color:"var(--green)",w:44,h:54,m:0.2,draw:"drawMeter"}]}},
  video:{groups:{
    "Камеры":[
      {type:"cam_dome",name:"Купольная камера",color:"var(--cyan)",w:40,h:36,m:0.12,draw:"drawCamDome"},
      {type:"cam_bullet",name:"Цилиндр. камера",color:"var(--cyan)",w:46,h:28,m:0.25,draw:"drawCamBullet"},
      {type:"cam_ptz",name:"PTZ камера",color:"var(--cyan)",w:42,h:42,m:0.2,draw:"drawCamPTZ"}],
    "Запись и сеть":[
      {type:"nvr",name:"Видеорегистратор",color:"var(--purple)",w:64,h:34,m:0.44,draw:"drawNVR"},
      {type:"switchNet",name:"PoE коммутатор",color:"var(--cyan)",w:56,h:30,m:0.44,draw:"drawSwitchNet"},
      {type:"router",name:"Роутер",color:"var(--cyan)",w:44,h:30,m:0.3,draw:"drawRouter"}]}},
  cable:{groups:{
    "Прочее":[
      {type:"wall",name:"Стена",color:"var(--dim)",w:80,h:12,m:3,draw:"drawWall"},
      {type:"door",name:"Дверь",color:"var(--mut)",w:50,h:14,m:0.9,draw:"drawDoor"},
      {type:"sensor",name:"Датчик движения",color:"var(--green)",w:28,h:28,m:0.1,draw:"drawSensor"}]}}};

var state={elements:[],wires:[],texts:[],rooms:[],bg:null,pxPerMeter:0,mainProjectId:null};
var ui={tool:"select",zoom:1,panX:0,panY:0,selected:null,libTab:"electro",
  dragging:null,wirePreview:null,roomStart:null,roomPreview:null,
  rulerA:null,rulerB:null,rulerHover:null,lastWireTap:null,pendingTextPos:null,
  history:[],historyIdx:-1,cable:"vvg25",color:"var(--yel)",thick:3.5,bgBase:null};
var idCounter=1,bgImg=null;
function uid(){return "e"+(idCounter++)+"_"+Date.now().toString(36);}
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function fmt(n){return String(Math.round(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g," ");}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function toast(msg,type){var t=document.createElement("div");t.className="toast "+(type||"");t.textContent=msg;$("toasts").appendChild(t);
  setTimeout(function(){t.style.opacity="0";t.style.transition=".3s";setTimeout(function(){t.remove();},320);},3000);}
function resolveColor(c){var d=document.createElement("div");d.style.color=c;document.body.appendChild(d);
  var rgb=getComputedStyle(d).color;document.body.removeChild(d);return rgb;}
function wirePxLen(pts){var L=0;for(var i=1;i<pts.length;i++)L+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);return L;}
function wireLenM(w){return state.pxPerMeter?wirePxLen(w.points||[])/state.pxPerMeter:0;}
function wireLenLabel(w){var ct=CABLE_TYPES[w.cable]||CABLE_TYPES.vvg25;
  if(state.pxPerMeter)return ct.name+" · "+(wirePxLen(w.points||[])/state.pxPerMeter).toFixed(1)+" м";
  return ct.name;}
function wireMidpoint(pts){var total=wirePxLen(pts),target=total/2,acc=0;
  for(var i=1;i<pts.length;i++){var seg=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
    if(acc+seg>=target&&seg>0){var t=(target-acc)/seg;
      return{x:pts[i-1].x+(pts[i].x-pts[i-1].x)*t,y:pts[i-1].y+(pts[i].y-pts[i-1].y)*t};}
    acc+=seg;}
  return pts[0]||{x:0,y:0};}
function elScale(def){if(!def||!def.m||!state.pxPerMeter)return 1;
  var base=Math.max(def.w,def.h);var k=(def.m*state.pxPerMeter)/base;return Math.max(k,14/base);}
function elSize(def,el){var k=elScale(def)*(el&&el.scale?el.scale:1);
  return{w:(def?def.w:40)*k,h:(def?def.h:40)*k,k:k};}

var asTimer=null;
function scheduleAutoSave(){clearTimeout(asTimer);asTimer=setTimeout(doAutoSave,500);}
function doAutoSave(){try{localStorage.setItem("shema_autosave",JSON.stringify({data:state,name:$("projName").value,ts:Date.now()}));}catch(e){}}
window.addEventListener("pagehide",doAutoSave);
document.addEventListener("visibilitychange",function(){if(document.hidden)doAutoSave();});
function tryRestore(){try{var a=JSON.parse(localStorage.getItem("shema_autosave")||"null");
  if(a&&a.data){state=a.data;$("projName").value=a.name||"Новая схема";return true;}}catch(e){}
  return false;}

var canvas=$("canvas"),ctx=canvas.getContext("2d"),wrap=$("canvasWrap");
var W=0,H=0,DPR=window.devicePixelRatio||1;
function resizeCanvas(){var nw=wrap.clientWidth,nh=wrap.clientHeight;
  if(nw===W&&nh===H)return;W=nw;H=nh;
  canvas.width=Math.max(1,Math.round(W*DPR));canvas.height=Math.max(1,Math.round(H*DPR));
  canvas.style.width=W+"px";canvas.style.height=H+"px";draw();}
window.addEventListener("resize",resizeCanvas);
window.addEventListener("orientationchange",function(){setTimeout(resizeCanvas,120);});
if(window.ResizeObserver){new ResizeObserver(function(){resizeCanvas();}).observe(wrap);}
function screenToWorld(x,y){return{x:(x-ui.panX)/ui.zoom,y:(y-ui.panY)/ui.zoom};}
function loadBgImg(){if(!state.bg||!state.bg.src)return;
  if(bgImg&&bgImg.src===state.bg.src)return;
  bgImg=new Image();bgImg.onload=function(){draw();};bgImg.src=state.bg.src;}
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

function draw(){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);drawGrid();
  ctx.save();ctx.translate(ui.panX,ui.panY);ctx.scale(ui.zoom,ui.zoom);
  try{
    if(state.bg){if(bgImg&&bgImg.complete&&bgImg.src===state.bg.src)drawBg();else loadBgImg();}
    state.rooms.forEach(drawRoom);state.wires.forEach(drawWire);
    state.elements.forEach(drawElement);state.texts.forEach(drawText);
    if(ui.wirePreview)drawWirePreview();
    if(ui.roomStart&&ui.roomPreview)drawRoomPreview();
    if(ui.rulerA)drawRulerPreview();
  }finally{ctx.restore();}
  updateInfo();}
function drawGrid(){var step=20*ui.zoom;if(step<8)return;
  ctx.save();ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue("--canvas-grid").trim();
  ctx.lineWidth=1;ctx.globalAlpha=.55;var ox=ui.panX%step,oy=ui.panY%step;
  ctx.beginPath();
  for(var x=ox;x<W;x+=step){ctx.moveTo(x,0);ctx.lineTo(x,H);}
  for(var y=oy;y<H;y+=step){ctx.moveTo(0,y);ctx.lineTo(W,y);}
  ctx.stroke();ctx.restore();}
function drawBg(){ctx.save();ctx.globalAlpha=state.bg.opacity==null?0.85:state.bg.opacity;
  ctx.drawImage(bgImg,state.bg.x,state.bg.y,state.bg.w,state.bg.h);ctx.globalAlpha=1;ctx.restore();}
var Drawers={
  drawPanel:function(c,w,h){c.strokeRect(-w/2,-h/2,w,h);c.beginPath();c.moveTo(-w/2,-h/2+h*.22);c.lineTo(w/2,-h/2+h*.22);c.stroke();for(var i=0;i<3;i++)c.strokeRect(-w/2+8,-h/2+h*.34+i*(h*.2),w-16,h*.13);},
  drawSocket:function(c,w,h){c.beginPath();c.arc(0,0,w/2,0,Math.PI*2);c.stroke();c.beginPath();c.arc(-5,0,2,0,Math.PI*2);c.stroke();c.beginPath();c.arc(5,0,2,0,Math.PI*2);c.stroke();},
  drawSocket2:function(c,w,h){c.strokeRect(-w/2,-h/2,w,h);c.beginPath();c.arc(-w/4,0,6,0,Math.PI*2);c.stroke();c.beginPath();c.arc(w/4,0,6,0,Math.PI*2);c.stroke();},
  drawSwitch:function(c,w,h){c.beginPath();c.arc(0,0,w/2,0,Math.PI*2);c.stroke();c.beginPath();c.moveTo(-w/2,0);c.lineTo(w/2,0);c.stroke();},
  drawSwitch2:function(c,w,h){c.beginPath();c.arc(0,0,w/2,0,Math.PI*2);c.stroke();c.beginPath();c.moveTo(-w/2,0);c.lineTo(w/2,0);c.moveTo(0,-h/2);c.lineTo(0,h/2);c.stroke();},
  drawLamp:function(c,w,h){c.beginPath();c.arc(0,0,w/2,0,Math.PI*2);c.stroke();c.beginPath();c.moveTo(-w/2*.7,-h/2*.7);c.lineTo(w/2*.7,h/2*.7);c.moveTo(w/2*.7,-h/2*.7);c.lineTo(-w/2*.7,h/2*.7);c.stroke();},
  drawSpot:function(c,w,h){c.beginPath();c.arc(0,0,w/2,0,Math.PI*2);c.stroke();c.beginPath();c.arc(0,0,w/4,0,Math.PI*2);c.stroke();},
  drawLed:function(c,w,h){c.strokeRect(-w/2,-h/2,w,h);c.beginPath();for(var i=0;i<4;i++){c.moveTo(-w/2+8+i*16,-h/2);c.lineTo(-w/2+8+i*16,h/2);}c.stroke();},
  drawJbox:function(c,w,h){c.strokeRect(-w/2,-h/2,w,h);c.beginPath();c.moveTo(-w/2,-h/2);c.lineTo(w/2,h/2);c.moveTo(w/2,-h/2);c.lineTo(-w/2,h/2);c.stroke();},
  drawMeter:function(c,w,h){c.strokeRect(-w/2,-h/2,w,h);c.beginPath();c.arc(0,-h/6,w/3.2,0,Math.PI*2);c.stroke();},
  drawCamDome:function(c,w,h){c.beginPath();c.arc(0,0,w/2,0,Math.PI*2);c.stroke();c.beginPath();c.arc(0,2,w/4,0,Math.PI*2);c.stroke();c.beginPath();c.moveTo(-w/2,-h/2+4);c.lineTo(w/2,-h/2+4);c.stroke();},
  drawCamBullet:function(c,w,h){c.strokeRect(-w/2,-h/2,w*.7,h);c.beginPath();c.arc(w/2-w*.15,0,h/2,0,Math.PI*2);c.stroke();},
  drawCamPTZ:function(c,w,h){c.strokeRect(-w/2,-h/2,w,h/2);c.beginPath();c.arc(0,h/8,w/3,0,Math.PI*2);c.stroke();},
  drawNVR:function(c,w,h){c.strokeRect(-w/2,-h/2,w,h);c.beginPath();c.moveTo(-w/2+8,0);c.lineTo(w/2-8,0);c.stroke();},
  drawSwitchNet:function(c,w,h){c.strokeRect(-w/2,-h/2,w,h);for(var i=0;i<4;i++)c.strokeRect(-w/2+7+i*(w-14)/4,-h/2+7,(w-14)/4-3,h-14);},
  drawRouter:function(c,w,h){c.strokeRect(-w/2,-h/2,w,h);c.beginPath();c.moveTo(-w/2+10,-h/2);c.lineTo(-w/2+6,-h/2-8);c.moveTo(w/2-10,-h/2);c.lineTo(w/2-6,-h/2-8);c.stroke();},
  drawWall:function(c,w,h){c.strokeRect(-w/2,-h/2,w,h);},
  drawDoor:function(c,w,h){c.beginPath();c.arc(-w/2,h/2,w,Math.PI*1.5,Math.PI*2);c.stroke();c.beginPath();c.moveTo(-w/2,h/2);c.lineTo(-w/2,h/2-w);c.moveTo(-w/2,h/2);c.lineTo(w/2,h/2);c.stroke();},
  drawSensor:function(c,w,h){c.beginPath();c.arc(0,0,w/2,0,Math.PI*2);c.stroke();c.beginPath();c.arc(0,0,w/4,0,Math.PI*2);c.stroke();}};
function drawElement(el){var def=findDef(el.type);var sz=elSize(def,el);
  var bw=def?def.w:40,bh=def?def.h:40,k=sz.k;
  ctx.save();ctx.translate(el.x,el.y);ctx.rotate((el.rot||0)*Math.PI/180);
  ctx.save();ctx.scale(k,k);
  var color=def?def.color:"var(--ink)";
  ctx.strokeStyle=resolveColor(color);ctx.fillStyle=resolveColor(color);
  ctx.lineWidth=1.6/Math.max(k,0.25);ctx.lineCap="round";ctx.lineJoin="round";
  if(def&&Drawers[def.draw])Drawers[def.draw](ctx,bw,bh);
  ctx.restore();
  if(el.label){ctx.font="11px 'Golos Text',sans-serif";ctx.textAlign="center";
    ctx.fillStyle=resolveColor("var(--mut)");ctx.fillText(el.label,0,sz.h/2+14);}
  if(ui.selected&&ui.selected.kind==="element"&&ui.selected.id===el.id){
    ctx.strokeStyle=resolveColor("var(--yel)");ctx.lineWidth=1.4;ctx.setLineDash([5,4]);
    ctx.strokeRect(-sz.w/2-8,-sz.h/2-8,sz.w+16,sz.h+16+(el.label?16:0));ctx.setLineDash([]);}
  ctx.restore();}
/* кабель + маленькая подпись метража (константный размер на экране) */
function drawWire(w){var ct=CABLE_TYPES[w.cable]||CABLE_TYPES.vvg25;
  var col=w.color||ct.color;var pts=w.points||[];
  ctx.save();ctx.strokeStyle=resolveColor(col);
  ctx.lineWidth=w.width||ui.thick;ctx.lineCap="round";ctx.lineJoin="round";
  var dash=w.style==="dash"||(ct.dash===true);
  if(dash)ctx.setLineDash([7,5]);
  ctx.beginPath();
  if(pts.length){ctx.moveTo(pts[0].x,pts[0].y);for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);}
  ctx.stroke();ctx.setLineDash([]);
  if(pts.length){[pts[0],pts[pts.length-1]].forEach(function(p){
    ctx.beginPath();ctx.arc(p.x,p.y,(w.width||ui.thick)/2+1.5,0,Math.PI*2);
    ctx.fillStyle=resolveColor(col);ctx.fill();});}
  if(pts.length>=2){
    var mid=wireMidpoint(pts);var label=wireLenLabel(w);
    var s=1/ui.zoom;                    /* константный экранный размер */
    var f=9*s,pad=3*s;
    ctx.font=f+"px 'JetBrains Mono',monospace";
    var tw=ctx.measureText(label).width;
    ctx.fillStyle="rgba(20,21,26,.82)";
    roundRect(ctx,mid.x-tw/2-pad,mid.y-f-pad-6*s,tw+pad*2,f+pad*2,3*s);ctx.fill();
    ctx.strokeStyle=resolveColor(col);ctx.lineWidth=Math.max(1,1*s);ctx.stroke();
    ctx.fillStyle="#fff";ctx.textAlign="center";ctx.fillText(label,mid.x,mid.y-8*s);}
  if(ui.selected&&ui.selected.kind==="wire"&&ui.selected.id===w.id){
    pts.forEach(function(p){ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);
      ctx.fillStyle=resolveColor("var(--yel)");ctx.fill();});}
  ctx.restore();}
function drawText(t){ctx.save();ctx.translate(t.x,t.y);
  ctx.font=(t.size||14)+"px 'Golos Text',sans-serif";
  ctx.fillStyle=resolveColor(t.color||"var(--ink)");ctx.textAlign="center";ctx.fillText(t.text,0,0);ctx.restore();}
function drawRoom(r){ctx.save();
  ctx.fillStyle=resolveColor(r.color||"var(--blue)");ctx.globalAlpha=.07;
  ctx.fillRect(r.x,r.y,r.w,r.h);ctx.globalAlpha=1;
  ctx.strokeStyle=resolveColor(r.color||"var(--blue)");ctx.lineWidth=1.6;ctx.setLineDash([8,5]);
  ctx.strokeRect(r.x,r.y,r.w,r.h);ctx.setLineDash([]);
  if(r.label){var lbl=r.label;
    if(state.pxPerMeter)lbl+=" · "+(r.w/state.pxPerMeter).toFixed(1)+"×"+(r.h/state.pxPerMeter).toFixed(1)+" м";
    ctx.font="12px 'Golos Text',sans-serif";ctx.fillStyle=resolveColor(r.color||"var(--blue)");
    ctx.textAlign="left";ctx.fillText(lbl,r.x+8,r.y+18);}
  ctx.restore();}
function drawWirePreview(){var ct=CABLE_TYPES[ui.cable]||CABLE_TYPES.vvg25;
  var col=ui.color||ct.color;var pts=ui.wirePreview.points||[];
  ctx.save();ctx.strokeStyle=resolveColor(col);ctx.lineWidth=ui.thick;ctx.setLineDash([6,4]);
  ctx.lineCap="round";ctx.lineJoin="round";
  if(pts.length){ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
    for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();}
  ctx.setLineDash([]);ctx.restore();updateWbLen();}
function drawRoomPreview(){ctx.save();var p=ui.roomPreview;
  ctx.strokeStyle=resolveColor("var(--blue)");ctx.lineWidth=1.6;ctx.setLineDash([8,5]);
  ctx.strokeRect(p.x,p.y,p.w,p.h);ctx.setLineDash([]);ctx.restore();}
function drawRulerPreview(){var a=ui.rulerA,b=ui.rulerB||ui.rulerHover;
  ctx.save();
  if(b){ctx.strokeStyle=resolveColor("var(--red)");ctx.lineWidth=2;ctx.setLineDash([6,4]);
    ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([]);
    var L=Math.hypot(b.x-a.x,b.y-a.y);
    var s=1/ui.zoom;ctx.font=(10*s)+"px 'JetBrains Mono',monospace";
    ctx.fillStyle=resolveColor("var(--red)");ctx.textAlign="center";
    ctx.fillText(state.pxPerMeter?(L/state.pxPerMeter).toFixed(2)+" м":fmt(Math.round(L))+" px",(a.x+b.x)/2,(a.y+b.y)/2-10*s);}
  [a].concat(b?[b]:[]).forEach(function(p){ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fillStyle=resolveColor("var(--red)");ctx.fill();});
  ctx.restore();}

function findDef(type){for(var cat in LIBRARY)for(var g in LIBRARY[cat].groups){
  var arr=LIBRARY[cat].groups[g];
  for(var i=0;i<arr.length;i++)if(arr[i].type===type)return arr[i];}return null;}
function findById(kind,id){
  if(kind==="element")return state.elements.find(function(x){return x.id===id;});
  if(kind==="wire")return state.wires.find(function(x){return x.id===id;});
  if(kind==="text")return state.texts.find(function(x){return x.id===id;});
  if(kind==="room")return state.rooms.find(function(x){return x.id===id;});
  return null;}
function getSelWire(){return (ui.selected&&ui.selected.kind==="wire")?findById("wire",ui.selected.id):null;}
function hitTest(pos){
  for(var i=state.texts.length-1;i>=0;i--){var t=state.texts[i];
    ctx.font=(t.size||14)+"px 'Golos Text',sans-serif";var m=ctx.measureText(t.text);
    if(pos.x>t.x-m.width/2-8&&pos.x<t.x+m.width/2+8&&pos.y>t.y-(t.size||14)-6&&pos.y<t.y+8)return{kind:"text",id:t.id};}
  for(var j=state.elements.length-1;j>=0;j--){var el=state.elements[j],def=findDef(el.type),sz=elSize(def,el);
    if(Math.abs(pos.x-el.x)<sz.w/2+8&&Math.abs(pos.y-el.y)<sz.h/2+8)return{kind:"element",id:el.id};}
  var tol=clamp(18/ui.zoom,8,42);
  for(var k=state.wires.length-1;k>=0;k--){var wp=state.wires[k],pts=wp.points||[];
    for(var p=0;p<pts.length-1;p++)if(distToSeg(pos,pts[p],pts[p+1])<tol)return{kind:"wire",id:wp.id};}
  for(var r=state.rooms.length-1;r>=0;r--){var rm=state.rooms[r];
    if(pos.x>rm.x&&pos.x<rm.x+rm.w&&pos.y>rm.y&&pos.y<rm.y+rm.h)return{kind:"room",id:rm.id};}
  return null;}
function distToSeg(p,a,b){var dx=b.x-a.x,dy=b.y-a.y,L2=dx*dx+dy*dy;
  if(!L2)return Math.hypot(p.x-a.x,p.y-a.y);
  var t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/L2,0,1);
  return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy));}

function setTool(tool){ui.tool=tool;

/* тап в режиме кабеля: по объекту — выделить, по пустому — начать трассу */
function handleWireToolTap(pos){
  if(!ui.wirePreview){var hit=hitTest(pos);
    if(hit){ui.selected=hit;ui.tool="select";
      document.querySelectorAll(".tool-btn[data-tool]").forEach(function(b){
        b.classList.toggle("active",b.getAttribute("data-tool")==="select");});
      renderProps();draw();return;}}
  wireTap(pos);}
function wireTap(pos){var now=Date.now();
  if(ui.lastWireTap&&now-ui.lastWireTap.t<350&&Math.hypot(pos.x-ui.lastWireTap.x,pos.y-ui.lastWireTap.y)<15){
    if(ui.wirePreview&&ui.wirePreview.points.length>1)ui.wirePreview.points.pop();
    ui.lastWireTap=null;finishWire();return;}
  ui.lastWireTap={x:pos.x,y:pos.y,t:now};
  if(!ui.wirePreview)ui.wirePreview={points:[{x:pos.x,y:pos.y}]};
  else ui.wirePreview.points.push({x:pos.x,y:pos.y});
  draw();}
function finishWire(){if(ui.wirePreview&&ui.wirePreview.points.length>=2){
    pushHistory();
    var ct=CABLE_TYPES[ui.cable];var newId=uid();
    state.wires.push({id:newId,points:ui.wirePreview.points.slice(),
      cable:ui.cable,width:ui.thick,color:ui.color||ct.color,style:"solid"});
    var lenMsg=state.pxPerMeter?(wirePxLen(ui.wirePreview.points)/state.pxPerMeter).toFixed(1)+" м":"откалибруйте 📏";
    toast("Проложено: "+ct.name+" · "+lenMsg,"ok");
    ui.wirePreview=null;ui.lastWireTap=null;
    ui.selected={kind:"wire",id:newId};ui.tool="select";
    document.querySelectorAll(".tool-btn[data-tool]").forEach(function(b){
      b.classList.toggle("active",b.getAttribute("data-tool")==="select");});
    renderSpec();renderProps();draw();return;}
  ui.wirePreview=null;ui.lastWireTap=null;updateWbLen();draw();}
function rulerTap(pos){if(!ui.rulerA){ui.rulerA=pos;ui.rulerB=null;}
  else{ui.rulerB=pos;draw();
    var pxLen=Math.hypot(ui.rulerB.x-ui.rulerA.x,ui.rulerB.y-ui.rulerA.y);
    ui.rulerA=null;ui.rulerB=null;showCalibModal(pxLen);}
  draw();}
function showCalibModal(pxLen){
  openModal('<h3>Калибровка масштаба</h3>'
    +'<p style="color:var(--mut);font-size:13.5px;margin-bottom:14px">Отрезок <b class="mono" style="color:var(--ink)">'+fmt(Math.round(pxLen))+' px</b>. Введите его реальную длину в метрах.</p>'
    +'<div class="prop-row"><label>Длина, метров</label><input class="inp" id="calibM" type="number" step="0.01" min="0.01" inputmode="decimal" placeholder="3.5"></div>'
    +'<div class="modal-foot"><button class="btn btn-ghost" data-close>Отмена</button><button class="btn btn-amber" id="calibOk">Установить</button></div>');

/* текст через модальное окно (работает на мобильном) */

var isPanning=false,lastPan=null;
function down(sx,sy){var pos=screenToWorld(sx,sy);
  if(ui.tool==="select"){var hit=hitTest(pos);
    if(hit){ui.selected=hit;var obj=findById(hit.kind,hit.id);
      if(obj){pushHistory();ui.dragging={kind:hit.kind,obj:obj,startX:pos.x,startY:pos.y,origX:obj.x,origY:obj.y};}
      draw();renderProps();}
    else{ui.selected=null;renderProps();draw();isPanning=true;lastPan={x:sx,y:sy};}}
  else if(ui.tool==="room"){ui.roomStart=pos;ui.roomPreview={x:pos.x,y:pos.y,w:0,h:0};}
  else if(ui.tool==="text"){textTap(pos);}}
function move(sx,sy){var pos=screenToWorld(sx,sy);
  if(isPanning&&lastPan){ui.panX+=sx-lastPan.x;ui.panY+=sy-lastPan.y;lastPan={x:sx,y:sy};draw();return;}
  if(ui.dragging){var d=ui.dragging;d.obj.x=d.origX+(pos.x-d.startX);d.obj.y=d.origY+(pos.y-d.startY);draw();return;}
  if(ui.tool==="wire"&&ui.wirePreview){var lp=ui.wirePreview.points;lp[lp.length-1]={x:pos.x,y:pos.y};draw();return;}
  if(ui.tool==="ruler"&&ui.rulerA){ui.rulerHover=pos;draw();return;}
  if(ui.roomStart&&ui.roomPreview){
    ui.roomPreview={x:Math.min(ui.roomStart.x,pos.x),y:Math.min(ui.roomStart.y,pos.y),
      w:Math.abs(pos.x-ui.roomStart.x),h:Math.abs(pos.y-ui.roomStart.y)};draw();}}
function up(){if(isPanning){isPanning=false;lastPan=null;return;}
  if(ui.dragging){ui.dragging=null;renderProps();return;}
  if(ui.roomStart&&ui.roomPreview)confirmRoom();}
function confirmRoom(){var rp=ui.roomPreview;
  if(rp&&rp.w>20&&rp.h>20){pushHistory();var lbl=prompt("Название помещения:","Помещение");
    state.rooms.push({id:uid(),x:rp.x,y:rp.y,w:rp.w,h:rp.h,label:lbl||"",color:"var(--blue)"});renderSpec();}
  ui.roomStart=null;ui.roomPreview=null;draw();}

canvas.addEventListener("mousedown",function(e){var r=canvas.getBoundingClientRect();
  var sx=e.clientX-r.left,sy=e.clientY-r.top;if(e.button!==0)return;
  var pos=screenToWorld(sx,sy);
  if(ui.tool==="wire"){handleWireToolTap(pos);return;}
  if(ui.tool==="ruler"){rulerTap(pos);return;}
  down(sx,sy);});
canvas.addEventListener("mousemove",function(e){var r=canvas.getBoundingClientRect();move(e.clientX-r.left,e.clientY-r.top);});
canvas.addEventListener("mouseup",function(){up();});
canvas.addEventListener("wheel",function(e){e.preventDefault();
  var r=canvas.getBoundingClientRect(),sx=e.clientX-r.left,sy=e.clientY-r.top,oz=ui.zoom;
  ui.zoom=clamp(ui.zoom*(e.deltaY<0?1.12:0.89),.25,3);
  ui.panX=sx-(sx-ui.panX)*(ui.zoom/oz);ui.panY=sy-(sy-ui.panY)*(ui.zoom/oz);
  $("zoomPct").textContent=Math.round(ui.zoom*100)+"%";draw();},{passive:false});
canvas.addEventListener("dragover",function(e){e.preventDefault();});
canvas.addEventListener("drop",function(e){e.preventDefault();
  var type=e.dataTransfer.getData("text/plain");if(!type)return;
  var r=canvas.getBoundingClientRect();addElementAt(type,screenToWorld(e.clientX-r.left,e.clientY-r.top));});

var touchState={mode:null};
function tPt(t){var r=canvas.getBoundingClientRect();return{x:t.clientX-r.left,y:t.clientY-r.top};}
function pinchData(ts){var a=tPt(ts[0]),b=tPt(ts[1]);
  return{d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2};}
canvas.addEventListener("touchstart",function(e){e.preventDefault();
  if(e.touches.length===2){var p=pinchData(e.touches);
    touchState={mode:"pinch",d0:p.d,z0:ui.zoom,wm:screenToWorld(p.mx,p.my)};
    ui.dragging=null;isPanning=false;return;}
  if(e.touches.length===1){var t=tPt(e.touches[0]);
    touchState={mode:"press",startT:{x:t.x,y:t.y},moved:false};
    if(ui.tool==="wire"||ui.tool==="ruler"||ui.tool==="text")return;down(t.x,t.y);}},{passive:false});
canvas.addEventListener("touchmove",function(e){e.preventDefault();
  if(touchState.mode==="pinch"&&e.touches.length===2){var p=pinchData(e.touches);
    ui.zoom=clamp(touchState.z0*p.d/touchState.d0,.25,3);
    ui.panX=p.mx-touchState.wm.x*ui.zoom;ui.panY=p.my-touchState.wm.y*ui.zoom;
    $("zoomPct").textContent=Math.round(ui.zoom*100)+"%";draw();return;}
  if(e.touches.length===1&&touchState.mode==="press"){var t=tPt(e.touches[0]);
    if(Math.hypot(t.x-touchState.startT.x,t.y-touchState.startT.y)>8)touchState.moved=true;
    if(ui.tool!=="wire"&&ui.tool!=="ruler"&&ui.tool!=="text")move(t.x,t.y);}},{passive:false});
canvas.addEventListener("touchend",function(e){e.preventDefault();
  if(touchState.mode==="pinch"){if(e.touches.length<2)touchState={mode:null};return;}
  if(touchState.mode!=="press")return;
  var t=tPt(e.changedTouches[0]),isTap=!touchState.moved,pos=screenToWorld(t.x,t.y);
  if(ui.tool==="wire"){if(isTap)handleWireToolTap(pos);}
  else if(ui.tool==="ruler"){if(isTap)rulerTap(pos);}
  else if(ui.tool==="text"){if(isTap)textTap(pos);}
  else up();
  touchState={mode:null};},{passive:false});

document.addEventListener("keydown",function(e){
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA")return;
  var k=e.key.toLowerCase();
  if(k==="v"||k==="м")setTool("select");
  if(k==="w"||k==="ц")setTool("wire");
  if(k==="r"||k==="к")setTool("room");
  if(k==="t"||k==="е")setTool("text");
  if(k==="m"||k==="ь")setTool("ruler");
  if((e.ctrlKey||e.metaKey)&&k==="z"){e.preventDefault();undo();}
  if((e.ctrlKey||e.metaKey)&&k==="y"){e.preventDefault();redo();}
  if((e.key==="Delete"||e.key==="Backspace")&&ui.selected)deleteSelected();});

function deleteSelected(){if(!ui.selected)return;pushHistory();
  var k=ui.selected.kind,id=ui.selected.id;
  if(k==="element")state.elements=state.elements.filter(function(x){return x.id!==id;});
  if(k==="wire")state.wires=state.wires.filter(function(x){return x.id!==id;});
  if(k==="text")state.texts=state.texts.filter(function(x){return x.id!==id;});
  if(k==="room")state.rooms=state.rooms.filter(function(x){return x.id!==id;});
  ui.selected=null;draw();renderProps();renderSpec();toast("Удалено","err");}

function cableTotals(){var tot={};
  state.wires.forEach(function(w){var k=w.cable||"vvg25";tot[k]=(tot[k]||0)+wireLenM(w);});
  return tot;}
function elementCounts(){var counts={};
  state.elements.forEach(function(el){var def=findDef(el.type);if(!def)return;
    counts[def.name]=(counts[def.name]||0)+1;});
  return counts;}

function renderSpec(){var counts=elementCounts(),tot=cableTotals(),html="",n=0;
  Object.keys(counts).forEach(function(nm){n++;
    html+='<div class="spec-item"><div class="si-ic" style="color:var(--blue)"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="7"/></svg></div>'
      +'<div class="si-nm">'+esc(nm)+'</div><div class="si-ct">× '+counts[nm]+'</div>'
      +'<button class="si-del" data-deltype="'+esc(nm)+'">✕</button></div>';});
  Object.keys(tot).forEach(function(k){var ct=CABLE_TYPES[k]||CABLE_TYPES.vvg25;n++;
    html+='<div class="spec-item"><div class="si-ic" style="color:'+ct.color+'"><svg viewBox="0 0 32 32"><path d="M4 16c5-8 9 8 14 0s9 8 10 0"/></svg></div>'
      +'<div class="si-nm">'+esc(ct.name)+'</div><div class="si-ct">'+(state.pxPerMeter?tot[k].toFixed(1)+" м":"—")+'</div>'
      +'<button class="si-del" data-delcable="'+k+'">✕</button></div>';});
  if(!html)html='<div class="empty-prop">Схема пуста</div>';
  $("specList").innerHTML=html;$("specCount").textContent=n+" поз.";
  /* прямая привязка крестиков (надёжно на мобильном) */
  $("specList").querySelectorAll(".si-del").forEach(function(b){
    var act=function(ev){ev.stopPropagation();ev.preventDefault();
      if(b.getAttribute("data-delcable")){var ck=b.getAttribute("data-delcable");
        var nm=(CABLE_TYPES[ck]||{}).name||ck;
        if(confirm("Удалить все «"+nm+"»?")){pushHistory();
          state.wires=state.wires.filter(function(w){return w.cable!==ck;});
          draw();renderSpec();toast("Удалено","err");}}
      else{var tn=b.getAttribute("data-deltype");
        if(confirm("Удалить все «"+tn+"»?")){pushHistory();
          state.elements=state.elements.filter(function(el){var d=findDef(el.type);return !d||d.name!==tn;});
          draw();renderSpec();toast("Удалено","err");}}};
    b.addEventListener("click",act);
    b.addEventListener("touchend",function(ev){ev.preventDefault();act(ev);});});
  renderCost();}

/* СТОИМОСТЬ — цены только из прайс-листа основного проекта */
function findMainState(){
  for(var i=0;i<localStorage.length;i++){var key=localStorage.key(i);
    try{var v=JSON.parse(localStorage.getItem(key));
      if(v&&Array.isArray(v.projects)&&v.estimates&&typeof v.estimates==="object"){
        return{key:key,data:v};}}catch(e){}}
  return null;}
function normName(s){return String(s||"").toLowerCase().replace(/ё/g,"е").replace(/[×хx]/g,"x").replace(/[^a-zа-я0-9x.,]/g,"");}
function nameTokens(s){return normName(s).match(/[а-яa-z]+|\d+[.,]?\d*/g)||[];}
function matchPrice(pl,name){
  var nt=nameTokens(name);if(!nt.length)return null;
  var best=null,bestScore=0;
  pl.forEach(function(p){
    var pt=nameTokens(p.name);if(!pt.length)return;
    var score=0;
    nt.forEach(function(t){if(pt.indexOf(t)!==-1)score+=t.length;});
    if(score>bestScore){bestScore=score;best=p;}});
  return (best&&bestScore>=4)?(+best.price||0):null;}
function renderCost(){
  var ms=findMainState();var pl=ms&&ms.data.pricelist?ms.data.pricelist:null;
  var box=$("costList");
  if(!pl){box.innerHTML='<div class="empty-prop">Прайс-лист не найден.<br>Откройте и сохраните проект в основном приложении (index.html) — цены берутся из его прайса.</div>';
    $("costTotal").textContent="";return;}
  var html="",total=0;
  var tot=cableTotals();
  Object.keys(tot).forEach(function(k){
    var rt=CABLE_TYPES[k];var len=tot[k];if(len<0.01)return;
    var price=matchPrice(pl,rt.name);
    var sub=price!=null?len*price:null;
    if(sub!=null)total+=sub;
    html+='<div class="spec-item"><div class="si-nm">'+esc(rt.name)+'</div>'
      +'<div class="si-ct">'+len.toFixed(1)+' м'+(price!=null?' ×'+fmt(price):'')+'</div>'
      +'<div class="si-ct" style="min-width:64px;text-align:right">'+(sub!=null?fmt(Math.round(sub))+' ₽':'<span style="color:var(--dim)">нет в прайсе</span>')+'</div></div>';});
  var counts=elementCounts();
  Object.keys(counts).forEach(function(nm){
    var q=counts[nm];var price=matchPrice(pl,nm);
    var sub=price!=null?q*price:null;
    if(sub!=null)total+=sub;
    html+='<div class="spec-item"><div class="si-nm">'+esc(nm)+'</div>'
      +'<div class="si-ct">×'+q+(price!=null?' ×'+fmt(price):'')+'</div>'
      +'<div class="si-ct" style="min-width:64px;text-align:right">'+(sub!=null?fmt(Math.round(sub))+' ₽':'<span style="color:var(--dim)">нет в прайсе</span>')+'</div></div>';});
  if(!html)html='<div class="empty-prop">Добавьте кабели и элементы</div>';
  box.innerHTML=html;
  $("costTotal").textContent="Итого: "+fmt(Math.round(total))+" ₽";}

function updateInfo(){var h='<div class="info-chip"><div class="dot" style="background:var(--yel)"></div>Объектов: <b>'+state.elements.length+'</b></div>'
  +'<div class="info-chip"><div class="dot" style="background:var(--cyan)"></div>Трасс: <b>'+state.wires.length+'</b></div>';
  if(state.pxPerMeter)h+='<div class="info-chip"><div class="dot" style="background:var(--green)"></div>1 м = <b>'+state.pxPerMeter.toFixed(0)+' px</b></div>';
  else if(state.bg)h+='<div class="info-chip" style="color:var(--orange)"><div class="dot" style="background:var(--orange)"></div>Откалибруйте 📏</div>';
  $("canvasInfo").innerHTML=h;}

$("zoomIn").addEventListener("click",function(){zoomBy(1.2);});
$("zoomOut").addEventListener("click",function(){zoomBy(1/1.2);});
$("zoomFit").addEventListener("click",function(){ui.zoom=1;ui.panX=0;ui.panY=0;$("zoomPct").textContent="100%";draw();});
function zoomBy(f){var old=ui.zoom;ui.zoom=clamp(ui.zoom*f,.25,3);
  ui.panX=W/2-(W/2-ui.panX)*(ui.zoom/old);ui.panY=H/2-(H/2-ui.panY)*(ui.zoom/old);
  $("zoomPct").textContent=Math.round(ui.zoom*100)+"%";draw();}

function syncBgCard(){$("bgCard").style.display=state.bg?"block":"none";
  if(state.bg){
    $("bgOp").value=Math.round((state.bg.opacity==null?0.85:state.bg.opacity)*100);
    $("bgOpVal").textContent=$("bgOp").value+"%";
    if(ui.bgBase){var pct=Math.round(state.bg.w/ui.bgBase*100);
      $("bgScale").value=clamp(pct,10,400);$("bgScaleVal").textContent=pct+"%";}}}
function openBgPicker(){$("bgFile").click();}
$("btnBg").addEventListener("click",openBgPicker);
$("btnBgMb").addEventListener("click",openBgPicker);
$("bgFile").addEventListener("change",function(e){var file=e.target.files[0];if(!file)return;
  if(file.size>10*1024*1024){toast("Файл слишком большой (макс 10 МБ)","err");return;}
  var rd=new FileReader();
  rd.onload=function(){var img=new Image();
    img.onload=function(){pushHistory();
      var ratio=img.height/img.width;
      var vw=W/ui.zoom,vh=H/ui.zoom;
      var nw=vw*0.96,nh=nw*ratio;
      if(nh>vh*0.96){nh=vh*0.96;nw=nh/ratio;}
      var cx=(-ui.panX/ui.zoom)+vw/2, cy=(-ui.panY/ui.zoom)+vh/2;
      state.bg={src:rd.result,x:cx-nw/2,y:cy-nh/2,w:nw,h:nh,ratio:ratio,opacity:0.85};
      ui.bgBase=nw;bgImg=img;syncBgCard();draw();
      toast("План загружен и зафиксирован","ok");};
    img.src=rd.result;};
  rd.readAsDataURL(file);e.target.value="";});
$("bgScale").addEventListener("input",function(e){
  if(!state.bg||!ui.bgBase)return;
  var pct=parseFloat(e.target.value);
  var nw=ui.bgBase*pct/100, nh=nw*(state.bg.ratio||1);
  var cx=state.bg.x+state.bg.w/2, cy=state.bg.y+state.bg.h/2;
  state.bg.w=nw;state.bg.h=nh;state.bg.x=cx-nw/2;state.bg.y=cy-nh/2;
  $("bgScaleVal").textContent=Math.round(pct)+"%";draw();});
$("bgOp").addEventListener("input",function(e){
  if(!state.bg)return;state.bg.opacity=parseFloat(e.target.value)/100;
  $("bgOpVal").textContent=e.target.value+"%";draw();});
$("bgFit").addEventListener("click",function(){if(!state.bg)return;
  var vw=W/ui.zoom,vh=H/ui.zoom,nw=vw*0.96,nh=nw*(state.bg.ratio||1);
  if(nh>vh*0.96){nh=vh*0.96;nw=nh/(state.bg.ratio||1);}
  var cx=state.bg.x+state.bg.w/2,cy=state.bg.y+state.bg.h/2;
  state.bg.w=nw;state.bg.h=nh;state.bg.x=cx-nw/2;state.bg.y=cy-nh/2;
  ui.bgBase=nw;syncBgCard();draw();});

  pushHistory();state.bg=null;bgImg=null;ui.bgBase=null;syncBgCard();draw();toast("План удалён","err");}});

function getStore(){try{return JSON.parse(localStorage.getItem("shema_projects")||"{}");}catch(e){return{};}}

  var html='<h3>Проекты схем</h3><div class="proj-list-m">';

    +'<button class="btn btn-red btn-sm" data-del="'+esc(k)+'" style="width:auto">✕</button></div>';});
  html+='</div><div class="prop-row"><label>Создать новую схему</label>'
    +'<input class="inp" id="newProjName" placeholder="Название новой схемы"></div>'
    +'<div class="modal-foot"><button class="btn btn-ghost" data-close>Закрыть</button>'
    +'<button class="btn btn-amber" id="createProj">+ Создать</button></div>';
  openModal(html);
  $("createProj").addEventListener("click",function(){
    var nm=$("newProjName").value.trim();if(!nm){toast("Введите название","err");return;}
    pushHistory();state={elements:[],wires:[],texts:[],rooms:[],bg:null,pxPerMeter:0,mainProjectId:state.mainProjectId};
    bgImg=null;ui.bgBase=null;$("projName").value=nm;ui.selected=null;
    draw();renderProps();renderSpec();syncBgCard();closeModal();
    toast("Создана схема: "+nm,"ok");});
  $("modal").querySelectorAll("[data-open]").forEach(function(it){
    it.addEventListener("click",function(e){
      if(e.target.closest("[data-del]"))return;
      var k=it.getAttribute("data-open");var st=getStore();
      if(st[k]){pushHistory();state=st[k].data;$("projName").value=k;
        bgImg=null;ui.bgBase=state.bg?state.bg.w:null;ui.selected=null;
        draw();renderProps();renderSpec();syncBgCard();updateLinked();closeModal();
        toast("Открыто: "+k,"ok");}});});
  $("modal").querySelectorAll("[data-del]").forEach(function(b){
    b.addEventListener("click",function(e){e.stopPropagation();
      var k=b.getAttribute("data-del");
      if(confirm("Удалить схему «"+k+"»?")){var st=getStore();delete st[k];setStore(st);
        $("btnProjModal").click();toast("Удалено","err");}});});});

function updateLinked(){var el=$("linkedProj");
  if(!state.mainProjectId){el.textContent="не привязано";return;}
  var ms=findMainState();
  if(ms){var p=ms.data.projects.find(function(x){return x.id===state.mainProjectId;});
    if(p){el.textContent="✓ "+p.name;return;}}
  el.textContent="проект: "+state.mainProjectId;}
$("btnSendSmeta").addEventListener("click",function(){
  if(!state.pxPerMeter){toast("Сначала откалибруйте масштаб 📏","err");return;}
  var tot=cableTotals(),has=false;
  for(var k in tot)if(tot[k]>0.01)has=true;
  if(!has){toast("Нет нарисованных трасс","err");return;}
  var ms=findMainState();
  if(!ms){toast("Основное приложение не найдено. Разместите оба файла на одном домене.","err");return;}
  var md=ms.data,proj=null;
  if(state.mainProjectId)proj=md.projects.find(function(x){return x.id===state.mainProjectId;});
  if(!proj){
    var nm=prompt("Название проекта в основном приложении (будет создан):",$("projName").value||"Объект");
    if(!nm)return;
    var ts=0;md.projects.forEach(function(p){if((p.ts||0)>ts)ts=p.ts||0;});
    proj={id:"p"+Date.now().toString(36),name:nm,client:"",phone:"",address:"",type:"elektro",
      status:"active",dateStart:"",dateEnd:"",notes:"Создано из конструктора схем",createdAt:"",ts:ts+1,photos:[]};
    md.projects.push(proj);state.mainProjectId=proj.id;}
  if(!md.estimates[proj.id])md.estimates[proj.id]={discount:0,regionK:1,note:"",rows:[]};
  var est=md.estimates[proj.id];
  est.rows=est.rows.filter(function(r){return !r.fromShema;});
  for(var c in tot){if(tot[c]<0.01)continue;
    var ct=CABLE_TYPES[c];
    var price=matchPrice(md.pricelist||[],ct.name);
    est.rows.push({id:"sh"+c+Date.now().toString(36),name:ct.name,kind:"material",
      unit:ct.unit,qty:Math.round(tot[c]*10)/10,price:price!=null?price:0,trade:ct.trade,fromShema:true});}
  try{localStorage.setItem(ms.key,JSON.stringify(md));
    updateLinked();toast("✓ Трассы отправлены в смету «"+proj.name+"»","ok");}
  catch(e){toast("Ошибка записи","err");}});

function getBounds(){var minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9,has=false;
  state.elements.forEach(function(el){var sz=elSize(findDef(el.type),el);
    minX=Math.min(minX,el.x-sz.w/2);maxX=Math.max(maxX,el.x+sz.w/2);
    minY=Math.min(minY,el.y-sz.h/2);maxY=Math.max(maxY,el.y+sz.h/2);has=true;});
  state.wires.forEach(function(w){(w.points||[]).forEach(function(p){
    minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);has=true;});});
  state.rooms.forEach(function(r){minX=Math.min(minX,r.x);maxX=Math.max(maxX,r.x+r.w);
    minY=Math.min(minY,r.y);maxY=Math.max(maxY,r.y+r.h);has=true;});
  if(!has)return{x:0,y:0,w:600,h:400};
  return{x:minX,y:minY,w:maxX-minX,h:maxY-minY};}
$("btnExportPng").addEventListener("click",function(){

  var cx=c.getContext("2d");cx.scale(2,2);

  var octx=ctx,op={x:ui.panX,y:ui.panY},oz=ui.zoom,os=ui.selected;
  ctx=cx;ui.panX=-bounds.x+pad;ui.panY=-bounds.y+pad;ui.zoom=1;ui.selected=null;
  if(state.bg&&bgImg&&bgImg.complete)drawBg();
  state.rooms.forEach(drawRoom);state.wires.forEach(drawWire);
  state.elements.forEach(drawElement);state.texts.forEach(drawText);
  ctx=octx;ui.panX=op.x;ui.panY=op.y;ui.zoom=oz;ui.selected=os;
  var a=document.createElement("a");a.download=($("projName").value||"shema")+".png";
