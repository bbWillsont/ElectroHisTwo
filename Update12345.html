Патч A. Замените блок @media print в CSS
 
Найдите в <style> (ближе к концу):
@media print{
  body{background:#fff;padding:0}
  .app,.mtop,.mhead,.mnav,#overlay,#toasts,#pdfSource,#menu{display:none!important}
  #printSheet{display:block;background:#fff}
  #printSheet .doc{box-shadow:none;width:100%;min-width:0;padding:8px 4px;border-radius:0}
  #printSheet .doc-photos img{width:150px;height:100px}
  @page{margin:13mm}
}
 
Замените на:
@media print{
  @page{size:A4;margin:0}
  html,body{margin:0!important;padding:0!important;background:#fff}
  .app,.mtop,.mhead,.mnav,#overlay,#toasts,#pdfSource,#menu{display:none!important}
  #printSheet{display:block;background:#fff;padding:0!important;margin:0!important}
  /* каждый .doc — отдельный лист */
  #printSheet .doc{
    box-shadow:none!important;width:100%!important;min-width:0!important;
    padding:14mm 12mm!important;border-radius:0!important;margin:0!important;
    box-sizing:border-box;
    page-break-after:always;break-after:page;
  }
  #printSheet .doc:last-child{page-break-after:auto;break-after:auto}
  /* обёртки пакета (модуль схем) не должны добавлять своих отступов */
  #printSheet .doc-page{padding:0!important;margin:0!important}
  #printSheet .doc-page .doc{padding:14mm 12mm!important}
  /* межстраничные «прокладки» из doc-pack убираем */
  #printSheet > div[style*="height:26px"]{display:none!important}
  #printSheet .doc-photos img{width:150px;height:100px}
}
 
Что даёт:
• @page { size:A4; margin:0 } + body{margin:0} → браузеру негде печатать колонтитулы → title сверху и URL снизу исчезают.
• page-break-after: always на .doc → каждый документ (смета, дефектная ведомость, фотофиксация, каждая схема со спецификацией) начинается с нового листа.
• :last-child { page-break-after: auto } → не появляется пустая страница в конце.
• Правило для div[style*="height:26px"] убирает «прокладки», которые оригинальный doc-pack вставляет между документами (иначе они дают лишний отступ перед разрывом).
• Отступы от края листа даёт padding: 14mm 12mm внутри каждого .doc.

Патч C. Замените printHtml, чтобы title гарантированно не попадал в печать
 
Найдите в <script>:
function printHtml(html){
  document.getElementById("printSheet").innerHTML=html;
  try{ window.print(); }catch(e){ openPrintWindow(html); }
}
 
Замените на:
var _origPrintTitle = document.title;
function printHtml(html){
  var sheet=document.getElementById("printSheet");
  if(!sheet) return;
  var oldTitle=document.title;
  document.title="\u00A0";                 /* пустой заголовок на время печати */
  sheet.innerHTML=html;
  setTimeout(function(){
    try{ window.print(); }
    catch(e){ openPrintWindow(html); }
    setTimeout(function(){ document.title=oldTitle||_origPrintTitle; },300);
  },120);
}
 
Это страховка для браузеров, которые игнорируют @page{margin:0} и всё равно рисуют заголовок сверху.
