<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PANELCRAFT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#0a1628;--bg2:#132238;--bg3:#1a2d45;--bg4:#1e3350;--bg5:#243a55;
--accent:#3b82f6;--accent2:#2563eb;
--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
--border:#1e3a5f;
--red:#ef4444;--green:#22c55e;--yellow:#eab308;
}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px}

.header{position:fixed;top:0;left:0;right:0;height:48px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 10px;z-index:100;gap:8px}
.menu-btn{background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;padding:6px 8px;border-radius:8px}
.menu-btn:active{background:var(--bg3)}
.logo{font-size:13px;font-weight:700;letter-spacing:1px;color:#fff;display:flex;align-items:center;gap:5px}
.logo svg{width:22px;height:22px}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.notif-btn{background:none;border:none;color:var(--text2);font-size:18px;cursor:pointer;position:relative;padding:6px}
.notif-badge{position:absolute;top:-2px;right:-2px;background:var(--red);color:#fff;width:14px;height:14px;border-radius:50%;font-size:8px;display:flex;align-items:center;justify-content:center;font-weight:700}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff}

.main{position:fixed;top:48px;left:0;right:0;bottom:0;display:flex;flex-direction:column;overflow:hidden}

.proj-bar{padding:6px 10px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;flex-shrink:0}
.proj-bar select{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);padding:6px 8px;font-size:11px;outline:none}
.saved{display:flex;align-items:center;gap:3px;font-size:10px;color:var(--green);flex-shrink:0}
.saved::before{content:'✓';background:var(--green);color:#fff;width:13px;height:13px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700}

.tabs{display:flex;padding:6px 10px;gap:5px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.tabs button{flex:1;padding:7px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text2);cursor:pointer;font-size:11px;font-weight:500}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.canvas-area{position:relative;flex:1;min-height:0;background:#0a1628;overflow:hidden}
.canvas-area canvas{display:block;width:100%;height:100%}
.zoom-badge{position:absolute;top:6px;right:6px;background:rgba(59,130,246,0.9);color:#fff;padding:3px 7px;border-radius:4px;font-size:9px;font-weight:600;pointer-events:none}

.toolbar{position:absolute;bottom:6px;left:6px;right:6px;background:rgba(19,34,56,0.92);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:8px;padding:4px;display:flex;align-items:center;gap:2px;z-index:10}
.toolbar button{flex:1;padding:6px 3px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text2);cursor:pointer;font-size:9px;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.toolbar button .ico{font-size:14px;line-height:1}
.toolbar button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.toolbar button:active{transform:scale(0.95)}
.toolbar .sep{width:1px;height:24px;background:var(--border);flex-shrink:0}

.wire-bar{position:absolute;bottom:52px;left:6px;right:6px;background:rgba(19,34,56,0.92);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:6px;padding:5px;display:flex;align-items:center;gap:5px;z-index:10}
.wire-bar span{font-size:9px;color:var(--text2);margin-right:3px}
.wire-bar button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;flex-shrink:0}
.wire-bar button.active{border-color:#fff;transform:scale(1.1)}

.bottom-scroll{height:180px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 10px 12px;flex-shrink:0;background:var(--bg)}
.bottom-scroll::-webkit-scrollbar{width:3px}
.bottom-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden}
.card-h{padding:8px 10px;font-size:12px;font-weight:600;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-h .badge{background:var(--bg3);color:var(--text2);font-size:9px;padding:2px 5px;border-radius:3px;font-weight:500}
.card-b{padding:8px 10px}

.calc-row{display:flex;justify-content:space-between;padding:4px 0;font-size:11px}
.calc-row .l{color:var(--text2)}
.calc-row .v{color:var(--text);font-weight:500}
.calc-total{display:flex;justify-content:space-between;align-items:flex-end;padding:8px 0;border-top:1px solid var(--border);margin-top:4px}
.calc-total .lbl{font-size:10px;color:var(--text2)}
.calc-total .amt{font-size:18px;font-weight:700}
.calc-total .cnt{font-size:10px;color:var(--text3);margin-top:1px}
.save-btn{width:100%;padding:9px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;margin-top:6px}
.save-btn:active{background:var(--accent2)}

.bom-item{display:flex;align-items:center;gap:6px;padding:6px;background:var(--bg3);border-radius:5px;margin-bottom:4px}
.bom-item .ic{width:26px;height:26px;background:var(--bg4);border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
.bom-item .inf{flex:1;min-width:0}
.bom-item .inf .n{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bom-item .inf .q{font-size:9px;color:var(--text3)}
.bom-item .p{font-size:11px;font-weight:600;white-space:nowrap}

.spec-btn{width:100%;padding:8px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);cursor:pointer;font-size:11px;font-weight:500;margin-top:3px}

.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-overlay.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;bottom:0;left:0;right:0;max-height:80vh;background:var(--bg2);border-top:1px solid var(--border);border-radius:12px 12px 0 0;z-index:201;transform:translateY(100%);transition:transform .25s ease;display:flex;flex-direction:column}
.sheet.show{transform:translateY(0)}
.sheet-handle{width:32px;height:3px;background:var(--border);border-radius:2px;margin:6px auto}
.sheet-hdr{padding:8px 12px;font-size:13px;font-weight:600;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sheet-hdr button{background:none;border:none;color:var(--text2);font-size:16px;cursor:pointer;padding:4px}
.sheet-search{padding:6px 12px}
.sheet-search input{width:100%;padding:7px 9px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);font-size:11px;outline:none}
.sheet-tabs{display:flex;padding:0 12px;gap:3px;margin-bottom:5px}
.sheet-tabs button{flex:1;padding:5px;background:var(--bg3);border:1px solid var(--border);border-radius:4px;color:var(--text2);cursor:pointer;font-size:10px}
.sheet-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.sheet-list{flex:1;overflow-y:auto;padding:0 10px 12px;-webkit-overflow-scrolling:touch}
.cat{margin-bottom:3px}
.cat-h{padding:6px 7px;font-size:10px;font-weight:600;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:space-between;border-radius:4px}
.cat-h:active{background:var(--bg3)}
.cat-h .arr{transition:transform .2s;font-size:8px}
.cat-h.open .arr{transform:rotate(90deg)}
.cat-items{display:none;grid-template-columns:repeat(3,1fr);gap:4px;padding:2px 0 5px}
.cat-items.show{display:grid}
.ci{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:5px 2px;text-align:center;cursor:pointer}
.ci:active{border-color:var(--accent);background:var(--bg4);transform:scale(0.97)}
.ci .ci-ic{width:28px;height:28px;margin:0 auto 2px;display:flex;align-items:center;justify-content:center}
.ci .ci-ic svg{width:24px;height:24px}
.ci .ci-nm{font-size:7px;color:var(--text2);line-height:1.15}

.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:7px 14px;font-size:11px;z-index:300;opacity:0;transition:all .25s;white-space:nowrap;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.success{border-color:var(--green)}
.toast.error{border-color:var(--red)}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:400;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--bg2);border-radius:12px 12px 0 0;width:100%;max-height:75vh;overflow-y:auto;padding:14px}
.modal h2{font-size:14px;margin-bottom:10px}
.modal table{width:100%;border-collapse:collapse}
.modal th,.modal td{padding:6px 7px;text-align:left;border-bottom:1px solid var(--border);font-size:10px}
.modal th{color:var(--text2);font-weight:600}
.modal .total-row{font-weight:700;background:var(--bg3)}
.modal .close-btn{float:right;background:none;border:none;color:var(--text2);font-size:18px;cursor:pointer}
.modal-actions{display:flex;gap:5px;margin-top:10px}
.modal-actions button{flex:1;padding:9px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);cursor:pointer;font-size:11px}
.modal-actions button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>

<header class="header">
  <button class="menu-btn" onclick="toggleSheet()">☰</button>
  <div class="logo">
    <svg viewBox="0 0 28 28" fill="none"><rect x="2" y="2" width="24" height="24" rx="4" fill="#3b82f6"/><rect x="6" y="6" width="7" height="7" rx="1" fill="#fff"/><rect x="15" y="6" width="7" height="7" rx="1" fill="#fff" opacity="0.7"/><rect x="6" y="15" width="7" height="7" rx="1" fill="#fff" opacity="0.7"/><rect x="15" y="15" width="7" height="7" rx="1" fill="#fff" opacity="0.4"/></svg>
    PANELCRAFT
  </div>
  <div class="header-right">
    <button class="notif-btn">🔔<span class="notif-badge">2</span></button>
    <div class="avatar">И</div>
  </div>
</header>

<div class="main">
  <div class="proj-bar">
    <select><option>Щит управления насосами</option><option>Щит освещения</option></select>
    <div class="saved">Сохранено</div>
  </div>
  
  <div class="tabs">
    <button class="active" data-tab="schema" onclick="switchTab('schema',this)">Схема</button>
    <button data-tab="panel" onclick="switchTab('panel',this)">Щит</button>
  </div>

  <div class="canvas-area" id="canvasArea">
    <canvas id="mainCanvas"></canvas>
    <div class="zoom-badge" id="zoomBadge">100%</div>
    
    <div class="toolbar" id="toolbarSchema">
      <button id="ts-sel" class="active" onclick="setTool('select')"><span class="ico"></span><span>Выбор</span></button>
      <button id="ts-mov" onclick="setTool('move')"><span class="ico">✋</span><span>Двигать</span></button>
      <button id="ts-wir" onclick="setTool('wire')"><span class="ico">╱</span><span>Провод</span></button>
      <button id="ts-bus" onclick="setTool('bus')"><span class="ico">═</span><span>Шина</span></button>
      <div class="sep"></div>
      <button onclick="undo()"><span class="ico">↩</span><span>Отмена</span></button>
      <button onclick="redo()"><span class="ico"></span><span>Повтор</span></button>
      <button onclick="deleteSelected()"><span class="ico">🗑</span><span>Удалить</span></button>
    </div>
    
    <div class="toolbar" id="toolbarPanel" style="display:none">
      <button onclick="toggleSheet()"><span class="ico">➕</span><span>Добавить</span></button>
      <button id="tp-mov" class="active" onclick="setTool('move')"><span class="ico">✋</span><span>Двигать</span></button>
      <button id="tp-cab" onclick="setTool('wire')"><span class="ico"></span><span>Кабель</span></button>
      <div class="sep"></div>
      <button onclick="autoArrange()"><span class="ico">⚙</span><span>Авто</span></button>
      <button onclick="undo()"><span class="ico">↩</span><span>Отмена</span></button>
      <button onclick="deleteSelected()"><span class="ico">🗑</span><span>Удалить</span></button>
    </div>
    
    <div class="wire-bar" id="wireBar" style="display:none">
      <span>Цвет:</span>
      <button style="background:#ef4444" class="active" onclick="setWireColor('#ef4444',this)"></button>
      <button style="background:#3b82f6" onclick="setWireColor('#3b82f6',this)"></button>
      <button style="background:#22c55e" onclick="setWireColor('#22c55e',this)"></button>
      <button style="background:#eab308" onclick="setWireColor('#eab308',this)"></button>
      <button style="background:#a855f7" onclick="setWireColor('#a855f7',this)"></button>
    </div>
  </div>

  <div class="bottom-scroll" id="bottomScroll">
    <div class="card">
      <div class="card-h">Калькулятор <span class="badge" id="itemCount">0 поз.</span></div>
      <div class="card-b">
        <div class="calc-row"><span class="l">Оборудование</span><span class="v" id="eqCost">0 ₽</span></div>
        <div class="calc-row"><span class="l">Монтаж</span><span class="v" id="inCost">0 ₽</span></div>
        <div class="calc-row"><span class="l">Доставка</span><span class="v" id="dlCost">2 500 ₽</span></div>
        <div class="calc-total">
          <div><div class="lbl">Итого</div><div class="amt" id="totCost">0 ₽</div><div class="cnt" id="totCnt">0 позиций</div></div>
        </div>
        <button class="save-btn" onclick="saveProject()">Сохранить проект</button>
      </div>
    </div>

    <div class="card">
      <div class="card-h">Список материалов</div>
      <div class="card-b" id="bomList"></div>
      <button class="spec-btn" onclick="generateSpec()">📄 Спецификация</button>
    </div>
  </div>
</div>

<div class="sheet-overlay" id="sheetOverlay" onclick="toggleSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-hdr"><span>Библиотека</span><button onclick="toggleSheet()">✕</button></div>
  <div class="sheet-search"><input type="text" placeholder="Поиск..." id="sheetSearch" oninput="filterComps()"></div>
  <div class="sheet-tabs">
    <button class="active" onclick="switchSheetTab('equip',this)">Оборудование</button>
    <button onclick="switchSheetTab('term',this)">Клеммы</button>
    <button onclick="switchSheetTab('other',this)">Прочее</button>
  </div>
  <div class="sheet-list" id="sheetList"></div>
</div>

<div class="modal-overlay" id="specModal">
  <div class="modal">
    <button class="close-btn" onclick="closeModal()">✕</button>
    <h2>Спецификация</h2>
    <table><thead><tr><th>№</th><th>Наименование</th><th>Кол-во</th><th>Сумма</th></tr></thead><tbody id="specBody"></tbody></table>
    <div class="modal-actions">
      <button onclick="exportCSV()">📥 CSV</button>
      <button class="primary" onclick="closeModal()">Закрыть</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

    {uid:104,id:'a4',name:'QF4',sub:'УЗО',x:195,y:70,w:34,h:40,price:1850},
    {uid:105,id:'c3',name:'KM1',sub:'25A',x:30,y:160,w:50,h:45,price:2400},
    {uid:106,id:'c3',name:'KM2',sub:'25A',x:85,y:160,w:50,h:45,price:2400},
    {uid:107,id:'c3',name:'KM3',sub:'25A',x:140,y:160,w:50,h:45,price:2400},
    {uid:108,id:'r2',name:'KV1',sub:'Контр.',x:195,y:160,w:34,h:40,price:1450},
    {uid:109,id:'t1',name:'X1',sub:'2.5',x:30,y:250,w:10,h:28,price:85},
    {uid:110,id:'t1',name:'X2',sub:'2.5',x:44,y:250,w:10,h:28,price:85},

    {uid:112,id:'t1',name:'X4',sub:'2.5',x:72,y:250,w:10,h:28,price:85},

  ];
  pnlWires=[
    {id:1,pts:[{x:55,y:110},{x:55,y:160}],color:'#ef4444'},
    {id:2,pts:[{x:110,y:110},{x:110,y:160}],color:'#ef4444'},
    {id:3,pts:[{x:165,y:110},{x:165,y:160}],color:'#3b82f6'},
    {id:4,pts:[{x:55,y:205},{x:55,y:250}],color:'#ef4444'},
    {id:5,pts:[{x:110,y:205},{x:110,y:250}],color:'#3b82f6'},
  ];
}

let cv,cx,dpr;
const G=5;

function initCanvas(){
  cv=document.getElementById('mainCanvas');
  cx=cv.getContext('2d');
  dpr=window.devicePixelRatio||1;
  resizeCanvas();
  window.addEventListener('resize',resizeCanvas);
  setupEvents();
}

function resizeCanvas(){
  const area=document.getElementById('canvasArea');
  const w=area.clientWidth,h=area.clientHeight;
  cv.width=w*dpr;cv.height=h*dpr;
  cv.style.width=w+'px';cv.style.height=h+'px';
  draw();
}

function draw(){
  const w=cv.width/dpr,h=cv.height/dpr;
  cx.setTransform(dpr,0,0,dpr,0,0);
  cx.clearRect(0,0,w,h);
  if(S.tab==='schema')drawSchema(w,h);
  else drawPanel(w,h);
}

function drawSchema(w,h){
  cx.fillStyle='#0a1628';cx.fillRect(0,0,w,h);
  cx.save();
  const sc=Math.min(w/500,h/750)*S.zoom;
  const ox=(w-500*sc)/2,oy=(h-750*sc)/2;
  cx.translate(ox,oy);cx.scale(sc,sc);
  cx.strokeStyle='rgba(30,58,95,0.25)';cx.lineWidth=0.5;
  for(let x=0;x<=500;x+=G){cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,750);cx.stroke();}
  for(let y=0;y<=750;y+=G){cx.beginPath();cx.moveTo(0,y);cx.lineTo(500,y);cx.stroke();}
  schWires.forEach(wr=>{
    cx.strokeStyle=wr.color;cx.lineWidth=2;cx.beginPath();
    wr.pts.forEach((p,i)=>{if(i===0)cx.moveTo(p.x,p.y);else cx.lineTo(p.x,p.y);});cx.stroke();
    wr.pts.forEach(p=>{cx.fillStyle=wr.color;cx.beginPath();cx.arc(p.x,p.y,3,0,Math.PI*2);cx.fill();});
    if(wr.label){cx.fillStyle=wr.color;cx.font='bold 11px sans-serif';cx.fillText(wr.label,wr.pts[0].x-22,wr.pts[0].y-6);}
  });
  schComps.forEach(c=>{
    const sel=S.selected&&S.selected.uid===c.uid;
    cx.fillStyle=sel?'rgba(59,130,246,0.2)':'rgba(26,45,69,0.9)';
    cx.strokeStyle=sel?'#3b82f6':'#475569';cx.lineWidth=sel?2:1;
    cx.fillRect(c.x-c.w/2,c.y-c.h/2,c.w,c.h);cx.strokeRect(c.x-c.w/2,c.y-c.h/2,c.w,c.h);
    if(c.id==='motor'){
      cx.strokeStyle='#e2e8f0';cx.lineWidth=1.5;cx.beginPath();cx.arc(c.x,c.y,18,0,Math.PI*2);cx.stroke();
      cx.fillStyle='#e2e8f0';cx.font='bold 14px sans-serif';cx.textAlign='center';cx.fillText('M',c.x,c.y+5);
    } else {
      cx.fillStyle='#e2e8f0';cx.fillRect(c.x-c.w/2+6,c.y-c.h/2+6,c.w-12,c.h-12);
      cx.fillStyle='#3b82f6';cx.fillRect(c.x-6,c.y-c.h/2+10,12,8);
    }
    cx.fillStyle='#e2e8f0';cx.font='bold 12px sans-serif';cx.textAlign='center';
    cx.fillText(c.name,c.x,c.y+c.h/2+16);
    if(c.sub){cx.fillStyle='#94a3b8';cx.font='10px sans-serif';cx.fillText(c.sub,c.x,c.y+c.h/2+28);}
    cx.textAlign='left';
    [[c.x-c.w/2,c.y],[c.x+c.w/2,c.y],[c.x,c.y-c.h/2],[c.x,c.y+c.h/2]].forEach(p=>{
      cx.fillStyle='#3b82f6';cx.beginPath();cx.arc(p[0],p[1],3,0,Math.PI*2);cx.fill();
    });
  });
  if(S.isDraw&&S.wireStart&&S.mousePos){
    cx.strokeStyle=S.wireColor;cx.lineWidth=2;cx.setLineDash([4,4]);
    cx.beginPath();cx.moveTo(S.wireStart.x,S.wireStart.y);cx.lineTo(S.mousePos.x,S.mousePos.y);cx.stroke();cx.setLineDash([]);
  }
  cx.restore();
}

function drawPanel(w,h){
  cx.fillStyle='#1a2230';cx.fillRect(0,0,w,h);
  cx.save();
  const sc=Math.min(w/300,h/340)*S.zoom;
  const ox=(w-300*sc)/2,oy=(h-340*sc)/2;
  cx.translate(ox,oy);cx.scale(sc,sc);
  cx.fillStyle='#2a3545';cx.fillRect(8,8,284,324);
  cx.strokeStyle='#475569';cx.lineWidth=2;cx.strokeRect(8,8,284,324);
  RAILS.forEach(r=>{
    cx.fillStyle='#c8d0d8';cx.fillRect(16,r.y,268,10);
    cx.strokeStyle='#94a3b8';cx.lineWidth=1;cx.strokeRect(16,r.y,268,10);
    for(let x=24;x<280;x+=12){cx.fillStyle='#94a3b8';cx.fillRect(x,r.y+3,4,4);}
    cx.fillStyle='#64748b';cx.font='9px sans-serif';cx.fillText(r.label,10,r.y-3);
  });
  pnlWires.forEach(wr=>{
    cx.strokeStyle=wr.color;cx.lineWidth=2;cx.beginPath();
    wr.pts.forEach((p,i)=>{if(i===0)cx.moveTo(p.x,p.y);else cx.lineTo(p.x,p.y);});cx.stroke();
    wr.pts.forEach(p=>{cx.fillStyle=wr.color;cx.beginPath();cx.arc(p.x,p.y,3,0,Math.PI*2);cx.fill();});
  });
  pnlComps.forEach(c=>{
    const sel=S.selected&&S.selected.uid===c.uid;
    cx.fillStyle=sel?'rgba(59,130,246,0.3)':'#e8ecf0';
    cx.strokeStyle=sel?'#3b82f6':'#64748b';cx.lineWidth=sel?2:1;
    cx.fillRect(c.x,c.y,c.w,c.h);cx.strokeRect(c.x,c.y,c.w,c.h);
    cx.fillStyle='#3b82f6';cx.fillRect(c.x+c.w/2-3,c.y+5,6,8);
    cx.fillStyle='#1e293b';cx.font='bold 8px sans-serif';cx.textAlign='center';
    cx.fillText(c.name,c.x+c.w/2,c.y+c.h+10);
    if(c.sub){cx.fillStyle='#64748b';cx.font='7px sans-serif';cx.fillText(c.sub,c.x+c.w/2,c.y+c.h+18);}
    cx.textAlign='left';
  });
  if(S.isDraw&&S.wireStart&&S.mousePos){
    cx.strokeStyle=S.wireColor;cx.lineWidth=2;cx.setLineDash([4,4]);
    cx.beginPath();cx.moveTo(S.wireStart.x,S.wireStart.y);cx.lineTo(S.mousePos.x,S.mousePos.y);cx.stroke();cx.setLineDash([]);
  }
  cx.restore();
}

function setupEvents(){
  cv.addEventListener('touchstart',onTS,{passive:false});
  cv.addEventListener('touchmove',onTM,{passive:false});
  cv.addEventListener('touchend',onTE,{passive:false});
  cv.addEventListener('mousedown',onMD);
  cv.addEventListener('mousemove',onMM);
  cv.addEventListener('mouseup',onMU);
  cv.addEventListener('wheel',onWh,{passive:false});
}

function getPos(e){const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}
function s2w(px,py){
  const w=cv.width/dpr,h=cv.height/dpr;let sc,ox,oy;
  if(S.tab==='schema'){sc=Math.min(w/500,h/750)*S.zoom;ox=(w-500*sc)/2;oy=(h-750*sc)/2;}
  else{sc=Math.min(w/300,h/340)*S.zoom;ox=(w-300*sc)/2;oy=(h-340*sc)/2;}
  return{x:(px-ox)/sc,y:(py-oy)/sc};
}
function findComp(pos,comps){for(let i=comps.length-1;i>=0;i--){const c=comps[i];if(pos.x>=c.x-c.w/2&&pos.x<=c.x+c.w/2&&pos.y>=c.y-c.h/2&&pos.y<=c.y+c.h/2)return c;}return null;}
function findPort(pos,comps){let best=null,md=25;comps.forEach(c=>{const ports=[{x:c.x-c.w/2,y:c.y},{x:c.x+c.w/2,y:c.y},{x:c.x,y:c.y-c.h/2},{x:c.x,y:c.y+c.h/2}];ports.forEach(p=>{const d=Math.hypot(pos.x-p.x,pos.y-p.y);if(d<md){md=d;best=p;}});});return best;}

function onTS(e){e.preventDefault();const p=getPos(e),w=s2w(p.x,p.y);handleStart(w);}
function onTM(e){e.preventDefault();const p=getPos(e),w=s2w(p.x,p.y);S.mousePos=w;handleMove(w);}
function onTE(e){e.preventDefault();handleEnd();}
function onMD(e){const p=getPos(e),w=s2w(p.x,p.y);handleStart(w);}
function onMM(e){const p=getPos(e),w=s2w(p.x,p.y);S.mousePos=w;handleMove(w);}
function onMU(e){handleEnd();}
function onWh(e){e.preventDefault();S.zoom=Math.max(0.5,Math.min(3,S.zoom*(e.deltaY>0?0.9:1.1)));document.getElementById('zoomBadge').textContent=Math.round(S.zoom*100)+'%';draw();}

function handleStart(w){
  const comps=S.tab==='schema'?schComps:pnlComps;
  const wires=S.tab==='schema'?schWires:pnlWires;
  if(S.tool==='move'){const c=findComp(w,comps);if(c){S.selected=c;S.isDrag=true;S.dragOff={x:w.x-c.x,y:w.y-c.y};}else S.selected=null;draw();return;}
  if(S.tool==='select'){S.selected=findComp(w,comps);draw();return;}
  if(S.tool==='wire'||S.tool==='bus'){
    const port=findPort(w,comps);
    if(port){if(!S.wireStart){S.wireStart=port;S.isDraw=true;}else{wires.push({id:Date.now(),pts:[S.wireStart,port],color:S.wireColor});S.wireStart=null;S.isDraw=false;saveH();draw();updateCalc();}}
    draw();
  }
}
function handleMove(w){
  if(S.isDrag&&S.selected&&S.tool==='move'){
    const c=S.selected;
    if(S.tab==='schema'){c.x=Math.round((w.x-S.dragOff.x)/G)*G;c.y=Math.round((w.y-S.dragOff.y)/G)*G;}
    else{c.x=Math.round((w.x-S.dragOff.x)/G)*G;let bestR=RAILS[0],bestD=Math.abs(c.y-bestR.y);RAILS.forEach(r=>{const d=Math.abs(c.y-r.y);if(d<bestD){bestD=d;bestR=r;}});c.y=bestR.y;}
    draw();
  }
  if(S.isDraw)draw();
}
function handleEnd(){if(S.isDrag&&S.selected)saveH();S.isDrag=false;}

function setTool(t){
  S.tool=t;
  document.querySelectorAll('.toolbar button').forEach(b=>b.classList.remove('active'));
  const map={select:'ts-sel',move:S.tab==='schema'?'ts-mov':'tp-mov',wire:S.tab==='schema'?'ts-wir':'tp-cab',bus:'ts-bus'};
  const btn=document.getElementById(map[t]);if(btn)btn.classList.add('active');
  document.getElementById('wireBar').style.display=(t==='wire'||t==='bus')?'flex':'none';
  S.wireStart=null;S.isDraw=false;draw();
}
function setWireColor(col,btn){S.wireColor=col;document.querySelectorAll('.wire-bar button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
function deleteSelected(){if(!S.selected){toast('Ничего не выбрано','error');return;}const comps=S.tab==='schema'?schComps:pnlComps;const idx=comps.findIndex(c=>c.uid===S.selected.uid);if(idx>=0)comps.splice(idx,1);S.selected=null;saveH();draw();updateCalc();toast('Удалено','success');}
function undo(){if(S.hIdx>0){S.hIdx--;restoreH();draw();updateCalc();}}
function redo(){if(S.hIdx<S.hist.length-1){S.hIdx++;restoreH();draw();updateCalc();}}
function saveH(){S.hist=S.hist.slice(0,S.hIdx+1);S.hist.push({s:JSON.parse(JSON.stringify(schComps)),sw:JSON.parse(JSON.stringify(schWires)),p:JSON.parse(JSON.stringify(pnlComps)),pw:JSON.parse(JSON.stringify(pnlWires))});S.hIdx=S.hist.length-1;if(S.hist.length>30){S.hist.shift();S.hIdx--;}}
function restoreH(){const h=S.hist[S.hIdx];schComps=JSON.parse(JSON.stringify(h.s));schWires=JSON.parse(JSON.stringify(h.sw));pnlComps=JSON.parse(JSON.stringify(h.p));pnlWires=JSON.parse(JSON.stringify(h.pw));}
function autoArrange(){let x=20;pnlComps.forEach((c,i)=>{const railIdx=Math.floor(i/5);if(railIdx<RAILS.length){c.y=RAILS[railIdx].y;c.x=x;x+=c.w+5;if(x>260){x=20;}}});saveH();draw();toast('Авторасстановка','success');}

function switchTab(tab,btn){
  S.tab=tab;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
  document.getElementById('toolbarSchema').style.display=tab==='schema'?'flex':'none';
  document.getElementById('toolbarPanel').style.display=tab==='panel'?'flex':'none';
  document.getElementById('wireBar').style.display='none';
  S.selected=null;S.zoom=1;S.tool=tab==='schema'?'select':'move';
  document.getElementById('zoomBadge').textContent='100%';
  document.querySelectorAll('.toolbar button').forEach(b=>b.classList.remove('active'));
  if(tab==='schema')document.getElementById('ts-sel').classList.add('active');
  else document.getElementById('tp-mov').classList.add('active');
  draw();
}

function toggleSheet(){document.getElementById('sheetOverlay').classList.toggle('show');document.getElementById('sheet').classList.toggle('show');if(document.getElementById('sheet').classList.contains('show'))renderSheet('equip');}
function switchSheetTab(tab,btn){document.querySelectorAll('.sheet-tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderSheet(tab);}
function renderSheet(tab){
  const list=document.getElementById('sheetList');const data=LIB[tab]||[];
  list.innerHTML=data.map(cat=>`<div class="cat"><div class="cat-h open" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('show')"><span>${cat.cat}</span><span class="arr">▶</span></div><div class="cat-items show">${cat.items.map(it=>`<div class="ci" onclick="addComponent('${tab}','${it.id}')"><div class="ci-ic">${compIcon(it)}</div><div class="ci-nm">${it.name}</div></div>`).join('')}</div></div>`).join('');
}
function compIcon(it){const cols={a1:'#3b82f6',a2:'#3b82f6',a3:'#3b82f6',a4:'#22c55e',a5:'#22c55e',a6:'#22c55e',c1:'#eab308',c2:'#eab308',c3:'#eab308',r1:'#a855f7',r2:'#a855f7',r3:'#a855f7',p1:'#ef4444',p2:'#ef4444',t1:'#eab308',t2:'#3b82f6',t3:'#22c55e',t4:'#3b82f6',t5:'#22c55e',o1:'#22c55e',o2:'#ef4444',o3:'#64748b',o4:'#64748b',o5:'#64748b'};const col=cols[it.id]||'#3b82f6';return `<svg viewBox="0 0 32 32"><rect x="6" y="2" width="20" height="28" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/><rect x="10" y="6" width="12" height="6" rx="1" fill="${col}"/><rect x="12" y="16" width="8" height="4" fill="#64748b"/></svg>`;}
function addComponent(tab,id){
  let item=null;LIB[tab].forEach(cat=>{cat.items.forEach(it=>{if(it.id===id)item=it;});});if(!item)return;
  const comps=S.tab==='schema'?schComps:pnlComps;
  const w=cv.width/dpr,h=cv.height/dpr;let cx2,cy2;
  if(S.tab==='schema'){const sc=Math.min(w/500,h/750)*S.zoom;cx2=(w/2-(w-500*sc)/2)/sc;cy2=(h/2-(h-750*sc)/2)/sc;}
  else{const sc=Math.min(w/300,h/340)*S.zoom;cx2=(w/2-(w-300*sc)/2)/sc;cy2=(h/2-(h-340*sc)/2)/sc;}
  const comp={uid:S.nextId++,id:item.id,name:item.name.substring(0,6),sub:'',x:cx2,y:cy2,w:item.w,h:item.h,price:item.price};
  if(S.tab==='panel'){let bestR=RAILS[0],bestD=Math.abs(cy2-bestR.y);RAILS.forEach(r=>{const d=Math.abs(cy2-r.y);if(d<bestD){bestD=d;bestR=r;}});comp.y=bestR.y;const railComps=pnlComps.filter(c=>c.y===bestR.y).sort((a,b)=>a.x-b.x);let newX=20;for(const rc of railComps){if(newX+item.w<=rc.x){break;}newX=rc.x+rc.w+5;}comp.x=newX;}
  comps.push(comp);saveH();draw();updateCalc();toggleSheet();toast('Добавлен: '+item.name,'success');
}
function filterComps(){const q=document.getElementById('sheetSearch').value.toLowerCase();document.querySelectorAll('.ci').forEach(el=>{const n=el.querySelector('.ci-nm').textContent.toLowerCase();el.style.display=n.includes(q)?'':'none';});}

function updateCalc(){
  const all=[...schComps,...pnlComps];const map={};
  all.forEach(c=>{if(!map[c.name])map[c.name]={name:c.name,qty:0,price:c.price};map[c.name].qty++;});
  let eq=0,it=0;Object.values(map).forEach(m=>{eq+=m.qty*m.price;it+=m.qty;});
  const ins=eq*0.11,dl=2500,tot=eq+ins+dl;
  document.getElementById('eqCost').textContent=eq.toLocaleString('ru-RU')+' ₽';
  document.getElementById('inCost').textContent=ins.toLocaleString('ru-RU',{minimumFractionDigits:0})+' ₽';
  document.getElementById('dlCost').textContent=dl.toLocaleString('ru-RU')+' ₽';
  document.getElementById('totCost').textContent=tot.toLocaleString('ru-RU')+' ₽';
  document.getElementById('totCnt').textContent=it+' позиций';
  document.getElementById('itemCount').textContent=it+' поз.';
  const bom=document.getElementById('bomList');
  bom.innerHTML=Object.values(map).map(m=>{const sum=m.qty*m.price;return `<div class="bom-item"><div class="ic">⚡</div><div class="inf"><div class="n">${m.name}</div><div class="q">${m.qty} шт</div></div><div class="p">${sum.toLocaleString('ru-RU')} ₽</div></div>`;}).join('')||'<div style="color:var(--text3);font-size:11px;text-align:center;padding:8px">Пусто</div>';
}

function generateSpec(){
  const all=[...schComps,...pnlComps];const map={};
  all.forEach(c=>{if(!map[c.name])map[c.name]={name:c.name,qty:0,price:c.price};map[c.name].qty++;});
  let tot=0,num=1;
  document.getElementById('specBody').innerHTML=Object.values(map).map(m=>{const sum=m.qty*m.price;tot+=sum;return `<tr><td>${num++}</td><td>${m.name}</td><td>${m.qty}</td><td>${sum.toLocaleString('ru-RU')} ₽</td></tr>`;}).join('')+`<tr class="total-row"><td colspan="3">Итого:</td><td>${tot.toLocaleString('ru-RU')} ₽</td></tr>`;
  document.getElementById('specModal').classList.add('show');
}
function closeModal(){document.getElementById('specModal').classList.remove('show');}
function exportCSV(){toast('CSV экспортирован','success');closeModal();}
function saveProject(){toast('Проект сохранён','success');}
function toast(msg,type='success'){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+type;setTimeout(()=>t.classList.remove('show'),2200);}

window.addEventListener('load',()=>{initCanvas();initPanel();saveH();updateCalc();});
</script>
