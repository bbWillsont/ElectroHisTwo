Шаг 1. Исправляем разрывы страниц при печати
 
Найдите в вашем <style> блок @media print (в самом конце стилей). Добавьте внутрь него правила для таблиц, чтобы строки не разрывались:
@media print{
  /* ... ваши существующие стили ... */

  /* Запрещаем разрывать строку таблицы на две страницы */
  #printSheet tr { 
    page-break-inside: avoid !important; 
    break-inside: avoid !important; 
  }
  /* Если таблица длинная — шапка таблицы (Наименование, Цена) будет повторяться на каждом новом листе */
  #printSheet thead { 
    display: table-header-group; 
  }
  #printSheet tfoot { 
    display: table-footer-group; 
  }
}
 
Шаг 2. Добавляем «Классический» дизайн
 
2.1. Добавьте стили в <style> (в общий блок, не в медиа-запрос печати):
/* === КЛАССИЧЕСКИЙ ДИЗАЙН (ГОСТ) === */
.doc .dtbl.t-classic {
  border-collapse: collapse;
  margin: 10px 0;
}
.doc .dtbl.t-classic th {
  border: 1px solid #000;
  background: #f0f0f0;
  color: #000;
  padding: 4px 6px;
  font-size: 9.5px;
  font-weight: 700;
  text-transform: uppercase;
}
.doc .dtbl.t-classic td {
  border: 1px solid #000;
  padding: 4px 6px;
  font-size: 11px;
  background: #fff;
}
.doc .dtbl.t-classic .doc-sec {
  background: #e9eaec;
  border: 1px solid #000;
  font-weight: 700;
}
 
2.2. Добавьте этот стиль в выпадающий список настроек.
Найдите в коде функцию renderDocs (настройки документов). Найдите там строку, где выбирается стиль таблиц:
+'<div><label>Стиль таблиц</label><select class="inp" name="tblStyle"><option value="grid" '+((pr.tblStyle||"grid")==="grid"?"selected":"")+'>Сетка</option><option value="striped" '+(pr.tblStyle==="striped"?"selected":"")+'>Полосатый</option><option value="minimal" '+(pr.tblStyle==="minimal"?"selected":"")+'>Минимализм</option></select></div>'
 
Замените её на эту (добавился пункт classic):
